  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    html,body{height:100%;}
    body{font-family:'Tajawal','Cairo',sans-serif;letter-spacing:0.01em;}
    *{-webkit-tap-highlight-color:transparent;}
    input,select,textarea,button{font-family:inherit;}
    ::selection{background:rgba(13,124,251,0.30);}
    ::-webkit-scrollbar{width:4px;height:4px;}
    ::-webkit-scrollbar-thumb{border-radius:4px;}
    @keyframes spin{from{transform:rotate(0deg);}to{transform:rotate(360deg);}}
    @keyframes modalIn{from{transform:translateY(100%);opacity:0;}to{transform:translateY(0);opacity:1;}}
    @keyframes overlayIn{from{opacity:0;}to{opacity:1;}}
    @keyframes toastSlide{from{transform:translateX(-50%) translateY(16px);opacity:0;}to{transform:translateX(-50%) translateY(0);opacity:1;}}
    @keyframes fadeUp{from{transform:translateY(8px);opacity:0;}to{transform:translateY(0);opacity:1;}}
    @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.35;}}
    @keyframes floaty{0%,100%{transform:translateY(0);}50%{transform:translateY(-10px);}}
    @keyframes shimmer{0%{background-position:200% 0;}100%{background-position:-200% 0;}}
    .spin{animation:spin 1s linear infinite;}
    .modal-sheet{animation:modalIn 0.32s cubic-bezier(0.32,0.72,0,1);}
    .overlay-ani{animation:overlayIn 0.2s ease;}
    .toast-ani{animation:toastSlide 0.3s cubic-bezier(0.34,1.56,0.64,1);}
    .fade-up{animation:fadeUp 0.3s cubic-bezier(0.2,0.8,0.3,1) both;}
    .floaty{animation:floaty 5s ease-in-out infinite;}
    button{transition:opacity 0.15s,transform 0.15s,background 0.2s,box-shadow 0.2s,border-color 0.2s;}
    button:active:not(:disabled){transform:scale(0.96);}
    input,select,textarea{transition:border-color 0.18s,box-shadow 0.18s;}
    input:focus,select:focus,textarea:focus{border-color:#0D7CFB !important;box-shadow:0 0 0 3px rgba(13,124,251,0.20);}
    .grad-text{background:linear-gradient(120deg,#4E9CFC,#0D7CFB 45%,#1652A2);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;}
    .card-hover{transition:transform 0.2s,box-shadow 0.2s,border-color 0.2s;}
    .card-hover:hover{transform:translateY(-2px);border-color:rgba(13,124,251,0.30) !important;}
    @media print{
      @page{margin:14mm;}
      body{background:#fff !important;}
      .no-print{display:none !important;}
      .inv-sheet{position:static !important;inset:auto !important;padding:0 !important;background:#fff !important;color:#000 !important;overflow:visible !important;}
      .inv-paper{box-shadow:none !important;border:none !important;border-radius:0 !important;max-width:100% !important;margin:0 !important;padding:0 !important;background:#fff !important;color:#000 !important;}
      .inv-paper *{color:#000 !important;}
      .inv-ink{background:#111 !important;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
      .inv-ink *{color:#fff !important;}
      .inv-rule{border-color:#bbb !important;}
    }
  </style>
</head>

document.documentElement.lang=_lang;

function toggleLang(){
  const nl=_lang==='ar'?'en':'ar';
  localStorage.setItem('_lang',nl);
  window.location.reload();
}
function toggleTheme(){
  const nt=_theme==='dark'?'light':'dark';
  localStorage.setItem('_theme',nt);
  window.location.reload();
}

  let s=TR[_lang]?.[key]||TR.ar[key]||key;
  args.forEach((a,i)=>{s=s.replace(`{${i}}`,a);});

// · Charcoal #1A1D22 · White · Soft Gray #F4F7FB
// Blue is the action colour (paid / done / active); neutral gray carries

// ─── MONEY ────────────────────────────────────────────────
// Amounts stay in the currency they were earned in; conversion to the base
// currency happens only for headline totals, so changing a rate never
// rewrites history.
const CUR_META={
  DZD:{ar:'دج',en:'DA'}, USD:{ar:'$',en:'$'}, EUR:{ar:'€',en:'€'},
  MAD:{ar:'درهم',en:'MAD'}, TND:{ar:'د.ت',en:'TND'}, GBP:{ar:'£',en:'£'},
  SAR:{ar:'ر.س',en:'SAR'}, AED:{ar:'د.إ',en:'AED'}, CAD:{ar:'C$',en:'C$'},
};
const curSym=code=>CUR_META[code]?.[_lang]||code;
const curList=st=>st?.currency?.list||DEF_SETTINGS.currency.list;
const curBase=st=>st?.currency?.base||'DZD';
const curRate=(code,st)=>{const c=curList(st).find(x=>x.code===code);return Number(c?.rate)||1;};
const toBase=(n,code,st)=>Number(n||0)*curRate(code,st)/curRate(curBase(st),st);
const money=(n,code)=>`${fmt(n)} ${curSym(code)}`;
// { DZD: 1200, USD: 40 } — each currency kept separate instead of faked into one
// "1 200 DA · 40 $" — never a blended number
const showCur=m=>{const k=Object.keys(m||{}).filter(c=>m[c]);return k.length?k.map(c=>money(m[c],c)).join(' · '):'—';};
const addCurMap=(m,code,n)=>{m[code]=(m[code]||0)+Number(n||0);return m;};
const sumByCur=(rows,pick,st)=>{
  const out={};
  (rows||[]).forEach(r=>{const c=r.currency||curBase(st);out[c]=(out[c]||0)+Number(pick(r)||0);});
  return out;
};

// Every call goes through a security-definer RPC. The anon key has no
// direct table access, so a stolen key alone yields nothing — each call
// carries a session token issued at login.
let TOK=localStorage.getItem('_tok')||null;
const setTok=t=>{TOK=t;t?localStorage.setItem('_tok',t):localStorage.removeItem('_tok');};

const RPC_ERR={
  not_found:'err_not_found', bad_password:'err_wrong_pw',
  agency_not_found:'err_no_agency', duplicate_email:'err_duplicate',
  weak_password:'err_pw', no_session:'err_session', forbidden:'err_forbidden',
};
const call=async(fn,args={})=>{
  let res;
  try{ res=await sb.rpc(fn,args); }
  catch(e){ throw new Error('❌ تعذّر الاتصال بالسيرفر. تحقق من الإنترنت أو حاول مجدداً.'); }
  const{data,error}=res;
  if(error){
    const raw=`${error.message||''}`;
    const key=Object.keys(RPC_ERR).find(k=>raw.includes(k));
    if(key==='no_session'){setTok(null);localStorage.removeItem('_session');}
    throw new Error(key?t(RPC_ERR[key]):raw||'error');
  }
  return data;
};

// ─── LOCAL MODE ───────────────────────────────────────────
// A self-contained backend in localStorage so the platform stays fully
// usable — and demo-able — when Supabase is unreachable. Data never
// leaves this browser and is kept apart from the real account.
let LOCAL=localStorage.getItem('_local')==='1';
const setLocal=v=>{v?localStorage.setItem('_local','1'):localStorage.removeItem('_local');LOCAL=v;};
const LKEY='_localdb';
const lread=()=>{try{return JSON.parse(localStorage.getItem(LKEY))||{agencies:[],data:{},session:null};}
                 catch(e){return{agencies:[],data:{},session:null};}};
const lwrite=db=>localStorage.setItem(LKEY,JSON.stringify(db));
// real hashing via SubtleCrypto — no home-made digest
const sha=async(pw,salt)=>{
  const buf=new TextEncoder().encode(`${salt}:${pw}`);
  const d=await crypto.subtle.digest('SHA-256',buf);
  return salt+'$'+[...new Uint8Array(d)].map(b=>b.toString(16).padStart(2,'0')).join('');
};
const shaMake=pw=>sha(pw,uid());
const shaCheck=async(pw,stored)=>{
  if(!stored||!stored.includes('$'))return false;
  return (await sha(pw,stored.split('$')[0]))===stored;
};
const lfail=key=>{throw new Error(t(key));};

const LocalDB={
  async register(name,email,password,phone='',accType='agency'){
    const db=lread(); email=email.toLowerCase().trim();
    if(db.agencies.some(a=>a.email===email))lfail('err_duplicate');
    const ag={id:uid(),name:name.trim(),email,phone,plan:'free',account_type:accType,
              is_active:true,plan_expires_at:null,notes:'',is_super:db.agencies.length===0,
              created_at:new Date().toISOString(),pw:await shaMake(password)};
    db.agencies.push(ag); db.data[ag.id]={...EMPTY};
    db.session={agencyId:ag.id}; lwrite(db);
    const{pw,...pub}=ag; return pub;
  },
  async loginAgency(email,password){
    const db=lread(); const ag=db.agencies.find(a=>a.email===email.toLowerCase().trim());
    if(!ag)lfail('err_not_found');
    if(!await shaCheck(password,ag.pw))lfail('err_wrong_pw');
    db.session={agencyId:ag.id}; lwrite(db);
    const{pw,...pub}=ag; return pub;
  },
  async loginWorker(agencyEmail,workerPassword){
    const db=lread(); const ag=db.agencies.find(a=>a.email===agencyEmail.toLowerCase().trim());
    if(!ag)lfail('err_no_agency');
    const d=norm(db.data[ag.id]);
    let found=null;
    for(const w of d.editors){ if(await shaCheck(workerPassword,w.pw)){found=w;break;} }
    if(!found)lfail('err_wrong_pw');
    db.session={agencyId:ag.id,workerId:found.id}; lwrite(db);
    const{pw,...pub}=ag; const{pw:_,...wpub}=found;
    return{agency:pub,worker:wpub,appData:d};
  },
  async loadData(){
    const db=lread(); if(!db.session)lfail('err_session');
    return norm(db.data[db.session.agencyId]);
  },
  async saveData(_id,data){
    const db=lread(); if(!db.session)lfail('err_session');
    db.data[db.session.agencyId]=data; lwrite(db);
  },
  async hashPassword(pw){ return shaMake(pw); },
  async logout(){ const db=lread(); db.session=null; lwrite(db); },
  async getAllAgencies(){ return lread().agencies.map(({pw,...a})=>a); },
  async getAgencyData(id){ return norm(lread().data[id]); },
  async updateAgency(id,patch){
    const db=lread(); db.agencies=db.agencies.map(a=>a.id===id?{...a,...patch}:a); lwrite(db);
  },
  async deleteAgency(id){
    const db=lread(); db.agencies=db.agencies.filter(a=>a.id!==id); delete db.data[id]; lwrite(db);
  },
  hasSession(){ return !!lread().session; },
};

// One surface for the app; the mode decides which backend answers.
const DB=new Proxy({},{get:(_,k)=>(LOCAL?LocalDB:RemoteDB)[k]});

// ─── REGISTER ─────────────────────────────────────────────
function Register({onBack,onSuccess}){
  const[name,setName]=useState('');const[email,setEmail]=useState('');
  const[phone,setPhone]=useState('');const[pw,setPw]=useState('');
  const[accType,setAccType]=useState('agency');
  const[show,setShow]=useState(false);const[err,setErr]=useState('');const[loading,setLoading]=useState(false);
  const[connErr,setConnErr]=useState(false);
  if(connErr)return<ConnError onRetry={()=>setConnErr(false)}/>;
  const submit=async()=>{
    if(!name.trim())return setErr(t('err_name'));
    if(!email.includes('@'))return setErr(t('err_email'));
    if(pw.length<4)return setErr(t('err_pw'));
    setLoading(true);setErr('');
    try{const ag=await DB.register(name.trim(),email.toLowerCase().trim(),pw,phone.trim(),accType);onSuccess(ag);}
    catch(e){
      const msg=e.message||'';
      if(msg.includes('تعذّر')||msg.includes('fetch'))setConnErr(true);
      else setErr(msg.includes('duplicate')||msg.includes('unique')?t('err_duplicate'):msg);
    }
    finally{setLoading(false);}
  };
  return(
    <AuthShell title={t('register')}>
      <div style={{display:'flex',flexDirection:'column',gap:'1rem'}}>
        <Field label={t('acc_type')}>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'0.5rem'}}>
            {[{v:'agency',l:t('agency'),h:t('agency_hint'),ic:'building'},{v:'solo',l:t('solo'),h:t('solo_hint'),ic:'video'}].map(o=>(
              <button key={o.v} onClick={()=>setAccType(o.v)}
                style={{padding:'0.75rem 0.5rem',borderRadius:'0.875rem',border:`2px solid ${accType===o.v?B.accent:B.border}`,background:accType===o.v?B.accentSoft:'transparent',cursor:'pointer',textAlign:'center'}}>
                <div style={{display:'flex',alignItems:'center',justifyContent:'center',gap:'0.4rem',fontWeight:'800',fontSize:'0.82rem',color:accType===o.v?B.accent:B.text}}>
                  <Ic n={o.ic} size={14} color={accType===o.v?B.accent:B.muted}/>{o.l}
                </div>
                <div style={{fontSize:'0.6rem',color:B.muted,marginTop:'0.25rem',lineHeight:1.4}}>{o.h}</div>
              </button>
            ))}
          </div>
        </Field>
        <Field label={accType==='solo'?t('your_name'):t('agency_name')}>
          <div style={{position:'relative'}}>
            <div style={{position:'absolute',right:'0.75rem',top:'50%',transform:'translateY(-50%)',display:'flex',pointerEvents:'none'}}><Ic n={accType==='solo'?'user':'building'} size={14} color={B.muted}/></div>
            <input value={name} onChange={e=>setName(e.target.value)} placeholder={accType==='solo'?'Ahmed Editor':'BGH Marketing'} style={{...INP,paddingRight:'2.5rem'}}/>
          </div>
        </Field>
        <Field label={t('email')}>
          <div style={{position:'relative'}}>
            <div style={{position:'absolute',right:'0.75rem',top:'50%',transform:'translateY(-50%)',display:'flex',pointerEvents:'none'}}><Ic n="mail" size={14} color={B.muted}/></div>
            <input type="email" value={email} onChange={e=>setEmail(e.target.value)} placeholder="agency@email.com" style={{...INP,paddingRight:'2.5rem'}}/>
          </div>
        </Field>
        <Field label={t('phone')}>
          <div style={{position:'relative'}}>
            <div style={{position:'absolute',right:'0.75rem',top:'50%',transform:'translateY(-50%)',display:'flex',pointerEvents:'none'}}><Ic n="phone" size={14} color={B.muted}/></div>
            <input value={phone} onChange={e=>setPhone(e.target.value)} placeholder="0555 123 456" style={{...INP,paddingRight:'2.5rem'}}/>
          </div>
        </Field>
        <Field label={t('password')}>
          <PwField value={pw} onChange={setPw} show={show} setShow={setShow} placeholder={t('pw_hint')} onEnter={submit}/>
        </Field>
        {err&&<div style={{fontSize:'0.75rem',color:B.danger,fontWeight:'700',padding:'0.5rem 0.75rem',background:`rgba(239,68,68,0.1)`,borderRadius:'0.5rem',border:`1px solid rgba(239,68,68,0.2)`}}>{err}</div>}
        <button onClick={submit} disabled={loading} style={{width:'100%',padding:'0.9rem',borderRadius:'0.875rem',background:`linear-gradient(135deg,${B.accent},${ACC2})`,color:'white',fontWeight:'800',border:'none',cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',gap:'0.5rem',opacity:loading?0.7:1,boxShadow:`0 6px 20px ${B.accent}44`,fontSize:'0.92rem'}}>
          {loading?<><span className="spin" style={{display:'inline-block'}}><Ic n="loader" size={16} color="white"/></span>{t('register')}...</>:t('start_free')}
        </button>
        <button onClick={onBack} style={{background:'none',border:'none',cursor:'pointer',color:B.muted,fontSize:'0.85rem',textAlign:'center',padding:'0.25rem'}}>{t('back')}</button>
      </div>
    </AuthShell>
  );
}

// ─── LOGIN ────────────────────────────────────────────────
function Login({onBack,onAgencyLogin,onWorkerLogin,onSuperAdmin}){
  const[role,setRole]=useState('agency');
  const[email,setEmail]=useState('');const[agEmail,setAgEmail]=useState('');
  const[pw,setPw]=useState('');const[show,setShow]=useState(false);
  const[err,setErr]=useState('');const[loading,setLoading]=useState(false);
  const[connErr,setConnErr]=useState(false);
  if(connErr)return<ConnError onRetry={()=>setConnErr(false)}/>;
  const submit=async()=>{
    if(!pw)return setErr(t('password'));
    setLoading(true);setErr('');
    try{
      if(role==='agency'){
        if(!email.includes('@'))return setErr(t('err_email'));
        const ag=await DB.loginAgency(email.toLowerCase().trim(),pw);
        if(ag.is_super){onSuperAdmin();return;}
        onAgencyLogin(ag);
      } else {
        if(!agEmail.includes('@'))return setErr(t('err_email'));
        const{agency,worker,appData}=await DB.loginWorker(agEmail,pw);
        onWorkerLogin(agency,worker,appData);
      }
    }catch(e){
      const msg=e.message||'';
      if(msg.includes('تعذّر')||msg.includes('fetch')){setConnErr(true);}
      else setErr(msg);
    }
    finally{setLoading(false);}
  };
  return(
    <AuthShell title={t('login')}>
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'0.375rem',padding:'0.25rem',background:B.inputBg,borderRadius:'0.75rem',marginBottom:'1.25rem'}}>
        {[{v:'agency',l:t('agency'),ic:'building'},{v:'worker',l:t('worker'),ic:'video'}].map(r=>(
          <button key={r.v} onClick={()=>{setRole(r.v);setErr('');setPw('');}}
            style={{padding:'0.625rem',borderRadius:'0.5rem',fontWeight:'700',fontSize:'0.875rem',display:'flex',alignItems:'center',justifyContent:'center',gap:'0.5rem',border:'none',cursor:'pointer',background:role===r.v?B.accent:'transparent',color:role===r.v?'white':B.muted,transition:'all 0.15s'}}>
            <Ic n={r.ic} size={15}/>{r.l}
          </button>
        ))}
      </div>
      <div style={{display:'flex',flexDirection:'column',gap:'1rem'}}>
        {role==='agency'?(
          <Field label={t('email')}>
            <div style={{position:'relative'}}>
              <div style={{position:'absolute',right:'0.75rem',top:'50%',transform:'translateY(-50%)',display:'flex',pointerEvents:'none'}}><Ic n="mail" size={14} color={B.muted}/></div>
              <input type="email" value={email} onChange={e=>setEmail(e.target.value)} placeholder="agency@email.com" style={{...INP,paddingRight:'2.5rem'}}/>
            </div>
          </Field>
        ):(
          <>
            <Field label={t('agency_email')}>
              <div style={{position:'relative'}}>
                <div style={{position:'absolute',right:'0.75rem',top:'50%',transform:'translateY(-50%)',display:'flex',pointerEvents:'none'}}><Ic n="building" size={14} color={B.muted}/></div>
                <input type="email" value={agEmail} onChange={e=>setAgEmail(e.target.value)} placeholder={t('worker_email_hint')} style={{...INP,paddingRight:'2.5rem'}}/>
              </div>
            </Field>
            <div style={{padding:'0.5rem 0.75rem',background:B.accentSoft,border:`1px solid ${B.accent}33`,borderRadius:'0.5rem',fontSize:'0.75rem',color:B.accent}}>
              {t('role_hint')}
            </div>
          </>
        )}
        <Field label={t('password')}>
          <PwField value={pw} onChange={setPw} show={show} setShow={setShow} placeholder={t('password')} onEnter={submit}/>
        </Field>
        {err&&<div style={{fontSize:'0.75rem',color:B.danger,fontWeight:'700',padding:'0.5rem 0.75rem',background:`rgba(239,68,68,0.1)`,borderRadius:'0.5rem',border:`1px solid rgba(239,68,68,0.2)`}}>{err}</div>}
        <button onClick={submit} disabled={loading} style={{width:'100%',padding:'0.9rem',borderRadius:'0.875rem',background:`linear-gradient(135deg,${B.accent},${ACC2})`,color:'white',fontWeight:'800',border:'none',cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',gap:'0.5rem',opacity:loading?0.7:1,boxShadow:`0 6px 20px ${B.accent}44`,fontSize:'0.92rem'}}>
          {loading?<><span className="spin" style={{display:'inline-block'}}><Ic n="loader" size={16} color="white"/></span>{t('login')}...</>:t('login')}
        </button>
        <button onClick={onBack} style={{background:'none',border:'none',cursor:'pointer',color:B.muted,fontSize:'0.85rem',textAlign:'center',padding:'0.25rem'}}>{t('back')}</button>
      </div>
    </AuthShell>
  );
}

// ─── SUPER ADMIN ──────────────────────────────────────────
function SuperAdmin({onLogout}){
  const[agencies,setAgencies]=useState([]);
  const[loading,setLoading]=useState(true);
  const[selected,setSelected]=useState(null);
  const[agData,setAgData]=useState(null);
  const[editAg,setEditAg]=useState(null);
  const[toast,setToast]=useState(null);
  const showToast=(msg,type='success')=>{setToast({msg,type});setTimeout(()=>setToast(null),2500);};

  useEffect(()=>{DB.getAllAgencies().then(d=>{setAgencies(d);setLoading(false);});},[]);

  const viewAgency=async ag=>{setSelected(ag);const d=await DB.getAgencyData(ag.id);setAgData(d);};
  const updateAgency=async(id,patch)=>{
    await DB.updateAgency(id,patch);
    setAgencies(a=>a.map(x=>x.id===id?{...x,...patch}:x));
    if(selected?.id===id)setSelected(s=>({...s,...patch}));
    showToast(t('toast_saved'));setEditAg(null);
  };
  const deleteAgency=async id=>{
    if(!confirm(t('confirm_delete')))return;
    await DB.deleteAgency(id);
    setAgencies(a=>a.filter(x=>x.id!==id));
    if(selected?.id===id){setSelected(null);setAgData(null);}
    showToast(t('toast_deleted'));

  const stats={total:agencies.length,active:agencies.filter(a=>a.is_active&&!isExpired(a)).length,paid:agencies.filter(a=>a.plan!=='free').length};

      <header style={{borderBottom:`1px solid ${B.border}`,background:B.navBg,backdropFilter:'blur(16px)',position:'sticky',top:0,zIndex:40}}>
        <div style={{maxWidth:'80rem',margin:'0 auto',padding:'0.7rem 1rem',display:'flex',alignItems:'center',justifyContent:'space-between'}}>
          <div style={{display:'flex',alignItems:'center',gap:'0.75rem'}}>
            <Logo size={36}/>
            <div>
              <div style={{fontWeight:'800',color:B.text,fontSize:'0.92rem',display:'flex',alignItems:'center',gap:'0.4rem'}}>{t('super_admin')} <Ic n="crown" size={14} color={B.warning}/></div>
              <div style={{fontSize:'0.62rem',color:B.muted}}>{t('admin_panel')}</div>
            </div>
          </div>
          <div style={{display:'flex',alignItems:'center',gap:'0.6rem'}}>
            <SettingsBar/>
            <button onClick={onLogout} style={{padding:'0.45rem 0.9rem',borderRadius:'9999px',border:`1px solid ${B.dangerSoft}`,background:B.dangerSoft,color:B.danger,fontWeight:'700',cursor:'pointer',display:'flex',alignItems:'center',gap:'0.4rem',fontSize:'0.78rem'}}>

            </button>

          <StatCard label={t('total_agencies')} value={stats.total} ic="building"/>
          <StatCard label={t('active_agencies')} value={stats.active} ic="checkCircle"/>
          <StatCard label={t('paid_subs')} value={stats.paid} ic="crown"/>
        </div>

        <div style={{display:'grid',gridTemplateColumns:selected?'1fr 1fr':'1fr',gap:'1.5rem'}}>
          <div style={{background:B.card,borderRadius:'1rem',border:`1px solid ${B.border}`,overflow:'hidden'}}>
            <div style={{padding:'1rem 1.25rem',borderBottom:`1px solid ${B.border}`,fontWeight:'800',fontSize:'1rem',color:B.text}}>
              {agencies.length} {t('total_agencies').split(' ')[1]||t('total_agencies')}
            </div>
            {agencies.length===0?<div style={{padding:'3rem',textAlign:'center',color:B.muted,fontSize:'0.875rem'}}>{t('no_agencies')}</div>
            :agencies.map(ag=>{
              const pl=planLabel(ag.plan);

              return(
                <div key={ag.id} style={{padding:'0.875rem 1.25rem',borderBottom:`1px solid ${B.border}`,background:selected?.id===ag.id?_theme==='dark'?B.card2:B.bg:'transparent'}}>
                  <div style={{display:'flex',alignItems:'center',gap:'0.75rem'}}>
                    <div style={{width:'2.5rem',height:'2.5rem',borderRadius:'50%',display:'grid',placeItems:'center',fontWeight:'700',flexShrink:0,background:B.accentSoft,color:B.accent}}>

                    </div>

                      <div style={{display:'flex',alignItems:'center',gap:'0.5rem',flexWrap:'wrap'}}>
                        <span style={{fontWeight:'700',color:B.text,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{ag.name}</span>
                        <span style={{fontSize:'0.6rem',fontWeight:'700',padding:'0.1rem 0.4rem',borderRadius:'9999px',background:pl.bg,color:pl.color}}>{pl.label}</span>
                        {sus&&<span style={{fontSize:'0.6rem',fontWeight:'700',padding:'0.1rem 0.4rem',borderRadius:'9999px',background:`rgba(239,68,68,0.15)`,color:B.danger}}>🚫</span>}
                        {exp&&!sus&&<span style={{fontSize:'0.6rem',fontWeight:'700',padding:'0.1rem 0.4rem',borderRadius:'9999px',background:`rgba(239,68,68,0.15)`,color:B.danger}}>⏰</span>}
                      </div>
                      <div style={{fontSize:'0.7rem',color:B.muted}}>{ag.email} {ag.phone&&<span style={{color:B.accent}}>· 📱 {ag.phone}</span>}</div>

          </div>

          {selected&&agData&&(
            <div style={{background:B.card,borderRadius:'1rem',border:`1px solid ${B.border}`,overflow:'hidden'}}>

                <div>
                  <div style={{fontWeight:'800',fontSize:'1rem',color:B.text}}>{selected.name}</div>
                  <div style={{fontSize:'0.75rem',color:B.muted}}>{selected.email} {selected.phone&&<span style={{color:B.accent}}>· 📱 {selected.phone}</span>}</div>
                </div>
                <button onClick={()=>{setSelected(null);setAgData(null);}} style={{background:'none',border:'none',cursor:'pointer',display:'flex',color:B.muted}}><Ic n="x" size={18}/></button>

                  {agData.videos.slice(0,10).map(v=>{

                      <div key={v.id} style={{padding:'0.6rem',borderBottom:`1px solid ${B.border}`,display:'flex',justifyContent:'space-between',alignItems:'center'}}>

                        </div>
                        <span style={{fontWeight:'700',fontSize:'0.8rem',color:B.text,fontVariantNumeric:'tabular-nums'}}>{fmt(v.price)}<span style={{fontSize:'0.62rem',color:B.muted}}> {curSym(v.currency||curBase(data.settings))}</span></span>

              </div>
            </div>
          )}

      </main>

      {editAg&&<EditAgencyModal ag={editAg} onClose={()=>setEditAg(null)} onSave={(id,patch)=>updateAgency(id,patch)}/>}
      <Toast toast={toast}/>
    </div>
  );
}

function EditAgencyModal({ag,onClose,onSave}){
  const[plan,setPlan]=useState(ag.plan||'free');
  const[days,setDays]=useState('30');
  const[active,setActive]=useState(ag.is_active!==false);
  const[notes,setNotes]=useState(ag.notes||'');
  const save=()=>{
    const patch={plan,is_active:active,notes};
    if(plan!=='free'&&days){const e=new Date();e.setDate(e.getDate()+Number(days));patch.plan_expires_at=e.toISOString();}
    if(plan==='free')patch.plan_expires_at=null;
    onSave(ag.id,patch);
  };
  return(
    <Modal onClose={onClose} title={`${t('manage')}: ${ag.name}`}>
      <div style={{display:'flex',flexDirection:'column',gap:'1rem'}}>
        <Field label={t('plan')}>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:'0.5rem'}}>
            {[{v:'free',l:t('free_plan'),c:B.muted},{v:'basic',l:'Basic',c:B.blue},{v:'pro',l:'Pro',c:B.accent}].map(p=>(
              <button key={p.v} onClick={()=>setPlan(p.v)}
                style={{padding:'0.625rem',borderRadius:'0.75rem',border:`2px solid ${plan===p.v?p.c:B.border}`,background:plan===p.v?`${p.c}22`:'transparent',color:p.c,fontWeight:'700',cursor:'pointer',fontSize:'0.8rem'}}>
                {p.l}
              </button>
            ))}
          </div>
        </Field>
        {plan!=='free'&&(
          <Field label={t('duration')}>
            <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:'0.5rem'}}>
              {[['30',t('one_month')],['90',t('three_months')],['365',t('one_year')]].map(([d,l])=>(
                <button key={d} onClick={()=>setDays(d)}
                  style={{padding:'0.5rem',borderRadius:'0.75rem',border:`2px solid ${days===d?B.accent:B.border}`,background:days===d?B.accentSoft:'transparent',color:days===d?B.accent:B.text,fontWeight:'700',cursor:'pointer',fontSize:'0.8rem'}}>
                  {l}
                </button>
              ))}
            </div>
          </Field>
        )}
        <label style={{display:'flex',alignItems:'center',gap:'0.75rem',padding:'0.875rem',background:active?B.accentSoft:B.dangerSoft,borderRadius:'0.75rem',cursor:'pointer',border:`1px solid ${active?B.accentBorder:'rgba(229,72,77,0.25)'}`}}>
          <input type="checkbox" checked={active} onChange={e=>setActive(e.target.checked)} style={{width:'1.25rem',height:'1.25rem',accentColor:B.success}}/>
          <div>
            <div style={{fontWeight:'700',color:active?B.success:B.danger,fontSize:'0.875rem'}}>{active?t('account_active'):t('account_suspended')}</div>
          </div>
        </label>
        <Field label={t('notes')}>
          <textarea value={notes} onChange={e=>setNotes(e.target.value)} placeholder={t('notes_ph')}
            style={{...INP,height:'70px',resize:'none'}}/>
        </Field>
        <button onClick={save} style={{width:'100%',padding:'0.9rem',borderRadius:'0.875rem',background:`linear-gradient(135deg,${B.accent},${ACC2})`,color:'white',fontWeight:'800',border:'none',cursor:'pointer',boxShadow:`0 4px 16px ${B.accent}44`}}>
          {t('save_changes')}
        </button>
      </div>
    </Modal>
  );
}

              <button key={s.id} onClick={()=>{setTab(s.id);setOpen(false);}} style={{width:'100%',display:'flex',alignItems:'center',gap:'0.75rem',padding:'0.8rem 0.9rem',border:'none',borderRadius:'1.15rem',cursor:'pointer',background:tab===s.id?B.accentSoft:'transparent',color:tab===s.id?B.accent:B.text,fontWeight:'700',fontSize:'0.85rem'}}>
                <Ic n={s.ic} size={17} color={tab===s.id?B.accent:B.textSub}/>{s.label}
              </button>
            ))}

        </div>
      )}
      <div style={{position:'fixed',bottom:'calc(0.9rem + env(safe-area-inset-bottom))',left:'0.9rem',right:'0.9rem',zIndex:45,background:B.navBg,border:`1px solid ${B.border}`,backdropFilter:'blur(24px)',display:'flex',borderRadius:'1.5rem',boxShadow:'0 12px 40px rgba(0,0,0,0.45)',padding:'0.3rem',maxWidth:'26rem',margin:'0 auto'}}>
        {primary.map(tt=>slot(tt,tab===tt.id,()=>{setTab(tt.id);setOpen(false);}))}
        {secondary.length>0&&slot({id:'__more',label:t('more'),ic:'dots'},inMore||open,()=>setOpen(o=>!o))}
      </div>
    </>
  );
}

// ─── AGENCY APP ───────────────────────────────────────────
function AgencyApp({agency,onLogout}){
  const[data,setData]=useState(EMPTY);
  const[loading,setLoading]=useState(true);
  const[saving,setSaving]=useState(false);
  const[tab,setTab]=useState('dashboard');
  const[toast,setToast]=useState(null);
  const[isMobile,setIsMobile]=useState(window.innerWidth<640);
  useEffect(()=>{const fn=()=>setIsMobile(window.innerWidth<640);window.addEventListener('resize',fn);return()=>window.removeEventListener('resize',fn);},[]);

  useEffect(()=>{DB.loadData().then(d=>{setData(d);setLoading(false);}).catch(()=>setLoading(false));},[agency.id]);

  const persist=async next=>{
    setData(next);setSaving(true);
    try{await DB.saveData(agency.id,next);}
    catch(e){showToast(t('toast_save_failed'),'error');}
    finally{setSaving(false);}
  };
  const showToast=(msg,type='success')=>{setToast({msg,type});setTimeout(()=>setToast(null),3000);};

  const canAdd=type=>{
    if(agency.plan!=='free')return true;
    if(type==='editor')return data.editors.length<FREE_LIMITS.editors;
    if(type==='client')return data.clients.length<FREE_LIMITS.clients;
    if(type==='video')return data.videos.length<FREE_LIMITS.videos;
    return true;
  };

  const solo=agency.account_type==='solo';
  // primary = daily work · secondary = setup, tucked behind "more" on mobile
  const primaryTabs=[
    {id:'dashboard',label:t('dashboard'),ic:'dashboard'},
    {id:'videos',label:t('videos'),ic:'film'},
    {id:'tasks',label:t('tasks'),ic:'task'},
    {id:'invoices',label:t('invoices'),ic:'receipt'},
  ];
  const secondaryTabs=[
    {id:'editors',label:t('team'),ic:'users'},
    {id:'clients',label:t('clients'),ic:'briefcase'},
    {id:'settings',label:t('settings'),ic:'sun'},
  ].filter(tt=>!(solo&&tt.id==='editors'));
  const tabs=[...primaryTabs,...secondaryTabs];

  const addEditor=async(name,pw,role='editor')=>{
    if(!canAdd('editor'))return showToast(t('toast_limit',FREE_LIMITS.editors),'error');
    try{
      const pwh=await DB.hashPassword(pw);
      persist({...data,editors:[...data.editors,{id:uid(),name,pw:pwh,role}]});
      showToast(t('toast_editor_added'));
    }catch(e){showToast(e.message,'error');}
  };
  const updEditor=(id,patch)=>persist({...data,editors:data.editors.map(e=>e.id===id?{...e,...patch}:e)});
  const delEditor=id=>{if(!confirm(t('confirm_delete')))return;persist({...data,editors:data.editors.filter(e=>e.id!==id),videos:data.videos.filter(v=>v.editorId!==id),tasks:data.tasks.map(k=>k.editorId===id?{...k,editorId:''}:k)});showToast(t('toast_deleted'));};
  const addClient=c=>{
    if(!canAdd('client'))return showToast(t('toast_limit',FREE_LIMITS.clients),'error');
    persist({...data,clients:[...data.clients,{id:uid(),...c}]});showToast(t('toast_client_added'));
  };
  const updClient=(id,patch)=>persist({...data,clients:data.clients.map(c=>c.id===id?{...c,...patch}:c)});
  const delClient=id=>{if(!confirm(t('confirm_delete')))return;persist({...data,clients:data.clients.filter(c=>c.id!==id),videos:data.videos.filter(v=>v.clientId!==id),invoices:data.invoices.filter(i=>i.clientId!==id),tasks:data.tasks.filter(k=>k.clientId!==id)});showToast(t('toast_deleted'));};
  const addVideo=v=>{
    if(!canAdd('video'))return showToast(t('toast_limit',FREE_LIMITS.videos),'error');
    persist({...data,videos:[{id:uid(),...v,paid:false,createdAt:new Date().toISOString()},...data.videos]});showToast(t('toast_video_added'));
  };
  const updVideo=(id,patch)=>persist({...data,videos:data.videos.map(x=>x.id===id?{...x,...patch}:x)});
  const delVideo=id=>{if(!confirm(t('confirm_delete')))return;persist({...data,videos:data.videos.filter(x=>x.id!==id)});showToast(t('toast_deleted'));};
  const togglePaid=id=>{const v=data.videos.find(x=>x.id===id);persist({...data,videos:data.videos.map(x=>x.id===id?{...x,paid:!v.paid}:x)});};

  // ── invoices ──
  const addInvoice=inv=>{
    persist({...data,invoices:[{id:uid(),number:invNumber(data.invoices,data.settings.invoice.prefix),status:'draft',createdAt:new Date().toISOString(),...inv},...data.invoices]});
    showToast(t('toast_invoice_added'));
  };
  const updInvoice=(id,patch)=>persist({...data,invoices:data.invoices.map(x=>x.id===id?{...x,...patch}:x)});
  const delInvoice=id=>{if(!confirm(t('confirm_delete')))return;persist({...data,invoices:data.invoices.filter(x=>x.id!==id)});showToast(t('toast_deleted'));};
  // marking an invoice paid settles every video it covers
  const payInvoice=id=>{
    const inv=data.invoices.find(x=>x.id===id);if(!inv)return;
    const ids=new Set(invLines(inv,data.videos).filter(l=>l.videoId).map(l=>l.videoId));
    persist({...data,
      invoices:data.invoices.map(x=>x.id===id?{...x,status:'paid',paidAt:new Date().toISOString()}:x),
      videos:data.videos.map(v=>ids.has(v.id)?{...v,paid:true}:v)});
    showToast(t('toast_invoice_paid'));
  };

  const saveSettings=st=>{persist({...data,settings:st});showToast(t('toast_settings_saved'));};

  // ── tasks ──
  const addTask=tk=>{persist({...data,tasks:[{id:uid(),status:'todo',createdAt:new Date().toISOString(),...tk},...data.tasks]});showToast(t('toast_task_added'));};
  const updTask=(id,patch)=>persist({...data,tasks:data.tasks.map(x=>x.id===id?{...x,...patch}:x)});
  const delTask=id=>{if(!confirm(t('confirm_delete')))return;persist({...data,tasks:data.tasks.filter(x=>x.id!==id)});showToast(t('toast_deleted'));};

  const pl=planLabel(agency.plan);const dl=daysLeft(agency);

  if(loading)return(
    <div style={{minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center',background:B.bg,flexDirection:'column',gap:'1.25rem'}}>
      <div style={{position:'relative'}}>
        <Logo size={72}/>
        <div style={{position:'absolute',inset:-8,borderRadius:'32%',border:`2px solid ${B.accent}33`,animation:'spin 3s linear infinite'}}/>
      </div>
      <div style={{display:'flex',gap:'0.4rem'}}>
        {[0,1,2].map(i=><div key={i} style={{width:'6px',height:'6px',borderRadius:'50%',background:B.accent,opacity:0.6,animation:`pulse 1.2s ease ${i*0.2}s infinite`}}/>)}
      </div>
    </div>
  );

  return(
    <div style={{minHeight:'100vh',background:B.bg,fontFamily:"'Tajawal','Cairo',sans-serif"}}>
      <header style={{borderBottom:`1px solid ${B.border}`,background:B.navBg,backdropFilter:'blur(16px)',position:'sticky',top:0,zIndex:40}}>
        <div style={{maxWidth:'80rem',margin:'0 auto',padding:'0.7rem 1rem',display:'flex',alignItems:'center',justifyContent:'space-between',gap:'0.75rem'}}>
          <div style={{display:'flex',alignItems:'center',gap:'0.75rem'}}>
            <Logo size={36}/>
            <div>
              <div style={{fontWeight:'800',fontSize:'0.92rem',color:B.text,lineHeight:1.2}}>{agency.name}</div>
              <div style={{fontSize:'0.62rem',display:'flex',alignItems:'center',gap:'0.35rem',marginTop:'2px',flexWrap:'wrap'}}>
                <span style={{padding:'0.1rem 0.45rem',borderRadius:'9999px',background:pl.bg,color:pl.color,fontWeight:'700'}}>{pl.label}</span>
                {dl!==null&&<span style={{color:dl<7?B.danger:B.muted}}>· {t('days_left',dl)}</span>}
                {saving&&<span style={{color:B.accent}}>· ⟳</span>}
              </div>
            </div>
          </div>
          <div style={{display:'flex',alignItems:'center',gap:'0.5rem'}}>
            <SettingsBar/>
            {!isMobile&&<nav style={{display:'flex',gap:'0.15rem',background:B.inputBg,borderRadius:'9999px',padding:'0.2rem'}}>
              {tabs.map(tt=>(
                <button key={tt.id} onClick={()=>setTab(tt.id)}
                  style={{display:'flex',alignItems:'center',gap:'0.3rem',padding:'0.4rem 0.75rem',borderRadius:'9999px',border:'none',cursor:'pointer',fontWeight:'700',fontSize:'0.72rem',whiteSpace:'nowrap',background:tab===tt.id?B.accent:'transparent',color:tab===tt.id?'white':B.muted}}>
                  <Ic n={tt.ic} size={13}/>{tt.label}
                </button>
              ))}
            </nav>}
            <button onClick={onLogout} style={{padding:'0.45rem',borderRadius:'50%',border:`1px solid ${B.border}`,background:B.card,cursor:'pointer',color:B.muted,display:'flex'}}>
              <Ic n="logout" size={15}/>
            </button>
          </div>
        </div>
        {agency.plan==='free'&&(
          <div style={{background:B.accentSoft,borderTop:`1px solid ${B.accentBorder}`,padding:'0.35rem 1rem',textAlign:'center',fontSize:'0.7rem',color:B.accent,fontWeight:'700'}}>
            {t('free_warning',data.editors.length,FREE_LIMITS.editors,data.videos.length,FREE_LIMITS.videos)}
          </div>
        )}
        {dl!==null&&dl<=7&&dl>0&&(
          <div style={{background:B.dangerSoft,borderTop:`1px solid rgba(239,68,68,0.15)`,padding:'0.35rem 1rem',textAlign:'center',fontSize:'0.7rem',color:B.danger,fontWeight:'700'}}>
            {t('expiry_warning',dl)}
          </div>
        )}
      </header>

      <main style={{maxWidth:'80rem',margin:'0 auto',padding:'1.25rem 1rem',paddingBottom:isMobile?'6rem':'1.25rem'}}>
        {tab==='dashboard'&&<AgencyDash data={data} setTab={setTab} agency={agency} solo={solo}/>}
        {tab==='videos'&&<VideosTab data={data} addVideo={addVideo} updVideo={updVideo} delVideo={delVideo} togglePaid={togglePaid} solo={solo} selfName={agency.name}/>}
        {tab==='tasks'&&<TasksTab data={data} addTask={addTask} updTask={updTask} delTask={delTask} solo={solo}/>}
        {tab==='invoices'&&<InvoicesTab data={data} agency={agency} addInvoice={addInvoice} updInvoice={updInvoice} delInvoice={delInvoice} payInvoice={payInvoice}/>}
        {tab==='editors'&&<TeamTab data={data} addEditor={addEditor} updEditor={updEditor} delEditor={delEditor} canAdd={canAdd('editor')} limit={FREE_LIMITS.editors} plan={agency.plan}/>}
        {tab==='settings'&&<SettingsTab data={data} saveSettings={saveSettings} showToast={showToast}/>}
        {tab==='clients'&&<ClientsTab data={data} addClient={addClient} updClient={updClient} delClient={delClient} canAdd={canAdd('client')} limit={FREE_LIMITS.clients} plan={agency.plan}/>}
      </main>
      {isMobile&&<BottomNav primary={primaryTabs} secondary={secondaryTabs} tab={tab} setTab={setTab}/>}
      <Toast toast={toast}/>
    </div>
  );
}

// ─── WORKER APP ───────────────────────────────────────────
function WorkerApp({agency,worker,initialData,onLogout}){
  const[data,setData]=useState(initialData);
  const[saving,setSaving]=useState(false);
  const[tab,setTab]=useState('dashboard');
  const[toast,setToast]=useState(null);
  const[isMobile,setIsMobile]=useState(window.innerWidth<640);
  useEffect(()=>{const fn=()=>setIsMobile(window.innerWidth<640);window.addEventListener('resize',fn);return()=>window.removeEventListener('resize',fn);},[]);
  const showToast=(msg,type='success')=>{setToast({msg,type});setTimeout(()=>setToast(null),2500);};

  const myVideos=useMemo(()=>data.videos.filter(v=>v.editorId===worker.id),[data.videos,worker.id]);

  const persist=async next=>{
    setData(next);setSaving(true);
    try{await DB.saveData(agency.id,next);}
    catch(e){showToast(t('toast_save_failed'),'error');}
    finally{setSaving(false);}
  };

  const addVideo=v=>{
    persist({...data,videos:[{id:uid(),...v,editorId:worker.id,paid:false,createdAt:new Date().toISOString()},...data.videos]});
    showToast(t('toast_video_added'));
  };
  const updVideo=(id,patch)=>{
    const v=data.videos.find(x=>x.id===id);
    if(!v||v.editorId!==worker.id||v.paid)return showToast(t('toast_no_edit'),'error');
    delete patch.paid;
    persist({...data,videos:data.videos.map(x=>x.id===id?{...x,...patch}:x)});
  };
  const delVideo=id=>{
    const v=data.videos.find(x=>x.id===id);
    if(!v||v.editorId!==worker.id||v.paid)return showToast(t('toast_no_edit'),'error');
    if(!confirm(t('confirm_delete')))return;
    persist({...data,videos:data.videos.filter(x=>x.id!==id)});showToast(t('toast_deleted'));
  };

  // tasks — a member may only touch what is assigned to them
  const ownsTask=id=>data.tasks.find(x=>x.id===id)?.editorId===worker.id;
  const addTask=tk=>{persist({...data,tasks:[{id:uid(),status:'todo',createdAt:new Date().toISOString(),...tk,editorId:worker.id},...data.tasks]});showToast(t('toast_task_added'));};
  const updTask=(id,patch)=>{
    if(!ownsTask(id))return showToast(t('toast_no_edit'),'error');
    persist({...data,tasks:data.tasks.map(x=>x.id===id?{...x,...patch,editorId:worker.id}:x)});
  };
  const delTask=id=>{
    if(!ownsTask(id))return showToast(t('toast_no_edit'),'error');
    if(!confirm(t('confirm_delete')))return;
    persist({...data,tasks:data.tasks.filter(x=>x.id!==id)});showToast(t('toast_deleted'));

          <div style={{display:'flex',alignItems:'center',gap:'0.75rem'}}>

              {worker.name.charAt(0)}
            </div>
            <div>
              <div style={{fontWeight:'800',fontSize:'0.92rem',color:B.text,lineHeight:1.2}}>{worker.name}</div>
              <div style={{fontSize:'0.62rem',display:'flex',alignItems:'center',gap:'0.35rem',marginTop:'2px'}}>
                <span style={{padding:'0.1rem 0.45rem',borderRadius:'9999px',background:roleBg(wRole),color:roleColor(wRole),fontWeight:'700'}}>{roleLabel(wRole)}</span>
                <span style={{color:B.muted}}>· {agency.name}</span>
                {saving&&<span style={{color:B.accent}}>· ⟳</span>}
              </div>
            </div>
          </div>
          <div style={{display:'flex',alignItems:'center',gap:'0.5rem'}}>
            <SettingsBar/>
            {!isMobile&&<nav style={{display:'flex',gap:'0.15rem',background:B.inputBg,borderRadius:'9999px',padding:'0.2rem'}}>
              {tabs.map(tt=>(
                <button key={tt.id} onClick={()=>setTab(tt.id)}
                  style={{display:'flex',alignItems:'center',gap:'0.3rem',padding:'0.4rem 0.75rem',borderRadius:'9999px',border:'none',cursor:'pointer',fontWeight:'700',fontSize:'0.72rem',whiteSpace:'nowrap',background:tab===tt.id?B.accent:'transparent',color:tab===tt.id?'white':B.muted}}>
                  <Ic n={tt.ic} size={13}/>{tt.label}

            </nav>}
            <button onClick={onLogout} style={{padding:'0.45rem',borderRadius:'50%',border:`1px solid ${B.border}`,background:B.card,cursor:'pointer',color:B.muted,display:'flex'}}>

            </div>

      <Toast toast={toast}/>
    </div>
  );

// ─── AGENCY DASHBOARD ─────────────────────────────────────
function AgencyDash({data,setTab,agency,solo}){
  const st=data.settings;
  const stats=useMemo(()=>{
    const base=curBase(st);
    const cur=v=>v.currency||base;
    const tot={},pd={},owed={},mTot={};
    const ms=new Date();ms.setDate(1);ms.setHours(0,0,0,0);
    let mCnt=0;
    const be={};
    data.videos.forEach(v=>{
      const c=cur(v),p=Number(v.price||0);
      addCurMap(tot,c,p);
      v.paid?addCurMap(pd,c,p):addCurMap(owed,c,p);
      if(new Date(v.date)>=ms){addCurMap(mTot,c,p);mCnt++;}
      if(!be[v.editorId])be[v.editorId]={count:0,total:{},owed:{}};
      be[v.editorId].count++; addCurMap(be[v.editorId].total,c,p);
      if(!v.paid)addCurMap(be[v.editorId].owed,c,p);
    });
    // editors ranked by what they are owed, measured in the base currency
    const owedBase=m=>Object.keys(m).reduce((n,c)=>n+toBase(m[c],c,st),0);
    return{tot,pd,owed,mTot,mCnt,
      edRows:data.editors.map(e=>({...e,...(be[e.id]||{count:0,total:{},owed:{}})}))
        .sort((a,b)=>owedBase(b.owed)-owedBase(a.owed))};
  },[data,st]);

  const eMap=Object.fromEntries(data.editors.map(e=>[e.id,e.name]));
  const cMap=Object.fromEntries(data.clients.map(c=>[c.id,c.name]));

  if(!data.editors.length&&!data.clients.length&&!data.videos.length)return(
    <div style={{textAlign:'center',padding:'3.5rem 1rem'}} className="fade-up">

        <button onClick={()=>setTab('clients')} style={{display:'flex',alignItems:'center',gap:'0.5rem',padding:'0.75rem 1.5rem',borderRadius:'9999px',background:solo?`linear-gradient(135deg,${B.accent},${ACC2})`:B.card,color:solo?'white':B.text,fontWeight:'700',border:solo?'none':`1px solid ${B.border}`,cursor:'pointer',boxShadow:solo?`0 6px 20px ${B.accent}44`:'none'}}>
          <Ic n="briefcase" size={16} color={solo?'white':undefined}/>{t('clients')}
        </button>
      </div>
    </div>
  );

  return(

        <div style={{position:'absolute',top:'-3rem',right:'-3rem',width:'11rem',height:'11rem',borderRadius:'50%',background:'radial-gradient(circle,rgba(255,255,255,0.14),transparent 70%)'}}/>
        <div style={{position:'absolute',bottom:'-2rem',left:'-1.5rem',width:'7rem',height:'7rem',borderRadius:'50%',background:'radial-gradient(circle,rgba(255,255,255,0.08),transparent 70%)'}} className="floaty"/>
        <div style={{position:'relative'}}>
          <div style={{fontSize:'0.72rem',opacity:0.7,fontWeight:'600',letterSpacing:'0.05em',marginBottom:'0.4rem'}}>{t('this_month')} · {stats.mCnt} {t('videos')}</div>
          <div style={{fontSize:Object.keys(stats.mTot).length>1?'1.5rem':'2.4rem',fontWeight:'900',fontVariantNumeric:'tabular-nums',lineHeight:1.15,marginBottom:'0.25rem'}}>{showCur(stats.mTot)}</div>
          <div style={{display:'flex',gap:'1rem',marginTop:'0.75rem',fontSize:'0.72rem',opacity:0.8}}>
            <span>✓ {showCur(stats.pd)}</span>
            <span>⏳ {showCur(stats.owed)}</span>
          </div>
        </div>
      </div>
      <div style={{display:'grid',gridTemplateColumns:'repeat(2,1fr)',gap:'0.65rem'}}>
        <StatCard label={t('total')} value={showCur(stats.tot)} ic="trending" color={B.accent}/>
        <StatCard label={t('total_paid')} value={showCur(stats.pd)} ic="checkCircle" color={B.success}/>
        <StatCard label={t('remaining')} value={showCur(stats.owed)} ic="clock" color={B.textSub}/>
        <StatCard label={t('video_count')} value={data.videos.length} ic="film" color={B.purple}/>
      </div>
      {/* quick pulse on the two things that need action */}
      {(data.tasks.length>0||data.invoices.length>0)&&(
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'0.65rem'}}>
          <button onClick={()=>setTab('tasks')} style={{textAlign:_lang==='ar'?'right':'left',background:B.card,border:`1px solid ${B.border}`,borderRadius:'1.25rem',padding:'1rem',cursor:'pointer'}} className="card-hover">

            </div>
            <div style={{fontSize:'1.4rem',fontWeight:'900',color:B.text,fontVariantNumeric:'tabular-nums'}}>
              {(()=>{const m={};data.invoices.filter(i=>i.status!=='paid').forEach(i=>{const c=i.currency||curBase(data.settings);m[c]=(m[c]||0)+invTotals(i,data.videos).ttc;});
                const k=Object.keys(m);return k.length?k.map(c=>money(m[c],c)).join(' · '):money(0,curBase(data.settings));})()}
            </div>
          </button>

        {stats.edRows.length===0?<div style={{padding:'2rem',textAlign:'center',color:B.muted,fontSize:'0.875rem'}}>{t('no_team')}</div>

              <div style={{width:'2.5rem',height:'2.5rem',borderRadius:'50%',display:'grid',placeItems:'center',fontWeight:'800',flexShrink:0,background:`linear-gradient(135deg,${rc},${rc}77)`,color:'white',boxShadow:`0 2px 8px ${rc}44`}}>{e.name.charAt(0)}</div>

                <div style={{display:'flex',alignItems:'center',gap:'0.4rem'}}>

function VideosTab({data,addVideo,updVideo,delVideo,togglePaid,solo,selfName}){
  const[showForm,setShowForm]=useState(false);const[editing,setEditing]=useState(null);

  const cMap=Object.fromEntries(data.clients.map(c=>[c.id,c.name]));
  const filt=useMemo(()=>data.videos.filter(v=>{
    if(fE&&v.editorId!==fE)return false;if(fC&&v.clientId!==fC)return false;
    if(fS==='paid'&&!v.paid)return false;if(fS==='unpaid'&&v.paid)return false;
    if(search){const q=search.toLowerCase();if(!(v.title||'').toLowerCase().includes(q)&&!(eMap[v.editorId]||'').toLowerCase().includes(q)&&!(cMap[v.clientId]||'').toLowerCase().includes(q))return false;}
    return true;
  }),[data.videos,fE,fC,fS,search,eMap,cMap]);
  const tot=sumByCur(filt,v=>v.price,data.settings);

  const SI={width:'100%',padding:'0.5rem 0.75rem',background:B.inputBg,border:`1px solid ${B.border}`,borderRadius:'0.75rem',outline:'none',fontSize:'0.8rem',color:B.text};

    <div style={{display:'flex',flexDirection:'column',gap:'1.25rem'}}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',gap:'0.75rem'}}>

          <Ic n="plus" size={15} color="white"/>{t('new_video')}

        <div style={{position:'relative'}}>
          <span style={{position:'absolute',right:'0.75rem',top:'50%',transform:'translateY(-50%)',display:'flex',pointerEvents:'none'}}><Ic n="search" size={14} color={B.muted}/></span>
          <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="بحث..." style={{...SI,paddingRight:'2.2rem'}}/>
        </div>
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'0.5rem'}}>
          {!solo&&<select value={fE} onChange={e=>setFE(e.target.value)} style={SI}><option value="">{t('team')}</option>{data.editors.map(e=><option key={e.id} value={e.id}>{e.name}</option>)}</select>}
          <select value={fC} onChange={e=>setFC(e.target.value)} style={SI}><option value="">{t('clients')}</option>{data.clients.map(c=><option key={c.id} value={c.id}>{c.name}</option>)}</select>
          <select value={fS} onChange={e=>setFS(e.target.value)} style={SI}><option value="">— الكل —</option><option value="paid">{t('paid')}</option><option value="unpaid">{t('unpaid')}</option></select>
        </div>
      </div>
      <div style={{background:B.card,borderRadius:'1rem',border:`1px solid ${B.border}`,overflow:'hidden'}}>
        {filt.length===0?<div style={{padding:'2.5rem',textAlign:'center',color:B.muted,fontSize:'0.875rem'}}>{t('no_videos')}</div>
        :filt.map(v=>(
          <div key={v.id} style={{padding:'0.875rem 1rem',borderBottom:`1px solid ${B.border}`,position:'relative'}}>
            <div style={{position:'absolute',right:0,top:0,bottom:0,width:'3px',background:v.paid?B.success:B.muted,borderRadius:'0 3px 3px 0'}}/>
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',gap:'0.5rem'}}>

                  <span style={{fontWeight:'700',color:B.text,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',fontSize:'0.875rem'}}>{v.title||'—'}</span>
                  <button onClick={()=>togglePaid(v.id)} style={{fontSize:'0.6rem',fontWeight:'700',padding:'0.12rem 0.5rem',borderRadius:'9999px',border:'none',cursor:'pointer',background:v.paid?B.successSoft:B.card2,color:v.paid?B.success:B.textSub,flexShrink:0}}>
                    {v.paid?t('paid'):t('unpaid')}

              </div>
            </div>
          </div>
        ))}
      </div>
      {showForm&&<VideoForm editors={solo?[{id:'self',name:selfName,role:'editor'}]:data.editors} clients={data.clients} initial={editing} lockedEditor={solo} settings={data.settings} onClose={()=>{setShowForm(false);setEditing(null);}} onSave={f=>{if(editing)updVideo(editing.id,f);else addVideo(solo?{...f,editorId:'self'}:f);setShowForm(false);setEditing(null);}}/>}
    </div>
  );
}

// A line is the unit of billing. Older invoices stored videoIds only, so they
// are projected into lines on read and keep working untouched.
const invLines=(inv,videos)=>{
  if(inv.lines?.length)return inv.lines;
  const map=Object.fromEntries((videos||[]).map(v=>[v.id,v]));
  return (inv.videoIds||[]).map((id,k)=>{
    const v=map[id]; if(!v)return null;
    return{id:v.id,ref:String(k+1),desc:v.title||'—',qty:1,pu:Number(v.price||0),videoId:v.id,date:v.date};
  }).filter(Boolean);
};
const invTotals=(inv,videos)=>{
  const lines=invLines(inv,videos);
  const gross=lines.reduce((s,l)=>s+Number(l.qty||0)*Number(l.pu||0),0);
  const ht=Math.max(0,gross-Number(inv.discount||0));
  const vat=ht*(Number(inv.vat||0)/100);
  return{lines,gross,ht,vat,ttc:ht+vat};
};
const invCur=(inv,st)=>inv.currency||curBase(st);

            <tbody>
              {lines.map((l,n)=>(
                <tr key={l.id||n} className="inv-rule" style={{borderBottom:'1px solid #e6e8f0'}}>
                  <td style={{...cell,textAlign:start,color:'#8a8fa8',fontVariantNumeric:'tabular-nums'}}>{l.ref||n+1}</td>
                  <td style={{...cell,textAlign:start,fontWeight:'600'}}>{l.desc||'—'}</td>
                  <td style={{...cell,textAlign:'center',fontVariantNumeric:'tabular-nums'}}>{l.qty}</td>
                  <td style={{...cell,textAlign:end,fontVariantNumeric:'tabular-nums'}}>{fmt(l.pu)}</td>
                  <td style={{...cell,textAlign:end,fontWeight:'700',fontVariantNumeric:'tabular-nums'}}>{fmt(Number(l.qty||0)*Number(l.pu||0))}</td>
                </tr>
              ))}
            </tbody>
          </table>

          {/* totals */}
          <div style={{display:'flex',justifyContent:rtl?'flex-start':'flex-end',marginTop:'1.1rem'}}>
            <div style={{minWidth:'16rem'}}>
              {Number(inv.discount||0)>0&&(
                <div style={{display:'flex',justifyContent:'space-between',padding:'0.3rem 0.5rem',fontSize:'0.78rem',color:'#5c6185'}}>
                  <span>{t('discount')}</span><span style={{fontVariantNumeric:'tabular-nums'}}>− {fmt(inv.discount)}</span>
                </div>
              )}
              <div style={{display:'flex',justifyContent:'space-between',padding:'0.3rem 0.5rem',fontSize:'0.78rem',color:'#5c6185'}}>
                <span>{t('amount_ht')}</span><span style={{fontVariantNumeric:'tabular-nums'}}>{money(ht,cur)}</span>
              </div>
              <div style={{display:'flex',justifyContent:'space-between',padding:'0.3rem 0.5rem',fontSize:'0.78rem',color:'#5c6185'}}>
                <span>{t('amount_vat')} {Number(inv.vat||0)>0?`(${inv.vat}%)`:''}</span>
                <span style={{fontVariantNumeric:'tabular-nums'}}>{money(vat,cur)}</span>
              </div>
              <div className="inv-rule" style={{display:'flex',justifyContent:'space-between',padding:'0.65rem 0.5rem',borderTop:`2px solid ${ink}`,marginTop:'0.3rem',fontWeight:'900',fontSize:'1rem'}}>
                <span>{t('amount_ttc')}</span><span style={{fontVariantNumeric:'tabular-nums'}}>{money(ttc,cur)}</span>
              </div>
            </div>
          </div>

          {/* footer facts */}
          <div style={{marginTop:'1.5rem',display:'flex',flexDirection:'column',gap:'0.3rem',fontSize:'0.74rem',color:'#5c6185'}}>
            {(inv.object||st.invoice.object)&&<div><b style={{color:'#101223'}}>{t('invoice_object')} :</b> {inv.object||st.invoice.object}</div>}
            {(inv.paymentMode||st.invoice.paymentMode)&&<div><b style={{color:'#101223'}}>{t('payment_mode')} :</b> {inv.paymentMode||st.invoice.paymentMode}</div>}
            {inv.due&&<div><b style={{color:'#101223'}}>{t('due_date')} :</b> {fmtD(inv.due)}</div>}
            {inv.notes&&<div style={{whiteSpace:'pre-wrap',marginTop:'0.3rem'}}>{inv.notes}</div>}
          </div>

          <div style={{marginTop:'1.75rem',paddingTop:'0.8rem',borderTop:'1px solid #e6e8f0',fontSize:'0.6rem',color:'#a3a8c5',display:'flex',justifyContent:'space-between',gap:'1rem'}}>
            <span>{C.name||agency.name}</span>
            <span style={{fontVariantNumeric:'tabular-nums'}}>{inv.number} · {fmtD(inv.date)}</span>
          </div>
        </div>
      </div>
    </div>
  );
}

function InvoiceForm({data,initial,onClose,onSave}){
  const st=data.settings;
  const[f,setF]=useState(()=>initial?{...initial,lines:invLines(initial,data.videos)}:{
    clientId:data.clients[0]?.id||'',lines:[],date:today(),due:'',period:'',
    currency:curBase(st),vat:Number(st.invoice.vat||0),discount:'',
    object:st.invoice.object||'',paymentMode:st.invoice.paymentMode||'',notes:''});
  const[err,setErr]=useState('');
  const[pick,setPick]=useState(false);

  // a video belongs to at most one invoice
  const billed=useMemo(()=>{
    const s=new Set();
    data.invoices.forEach(i=>{if(!initial||i.id!==initial.id)invLines(i,data.videos).forEach(l=>l.videoId&&s.add(l.videoId));});
    return s;
  },[data.invoices,data.videos,initial]);
  const pool=useMemo(()=>data.videos.filter(v=>v.clientId===f.clientId&&!billed.has(v.id)),[data.videos,f.clientId,billed]);
  const taken=new Set(f.lines.filter(l=>l.videoId).map(l=>l.videoId));

  const setLine=(id,k,v)=>setF(p=>({...p,lines:p.lines.map(l=>l.id===id?{...l,[k]:v}:l)}));
  const delLine=id=>setF(p=>({...p,lines:p.lines.filter(l=>l.id!==id)}));
  const addBlank=()=>setF(p=>({...p,lines:[...p.lines,{id:uid(),ref:String(p.lines.length+1),desc:'',qty:1,pu:''}]}));
  const addVideo=v=>setF(p=>({...p,lines:[...p.lines,{id:uid(),ref:String(p.lines.length+1),desc:v.title||'—',qty:1,pu:Number(v.price||0),videoId:v.id,date:v.date}]}));

  const gross=f.lines.reduce((s,l)=>s+Number(l.qty||0)*Number(l.pu||0),0);
  const ht=Math.max(0,gross-Number(f.discount||0));
  const vat=ht*(Number(f.vat||0)/100);
  const cur=f.currency;

  const submit=()=>{
    if(!f.clientId)return setErr(t('err_no_client'));
    if(!f.lines.length)return setErr(t('err_no_items'));
    onSave({...f,discount:Number(f.discount||0),vat:Number(f.vat||0),
      videoIds:f.lines.filter(l=>l.videoId).map(l=>l.videoId),
      lines:f.lines.map(l=>({...l,qty:Number(l.qty||0),pu:Number(l.pu||0)}))});
  };
  const mini={...INP,padding:'0.45rem 0.55rem',fontSize:'0.78rem'};

  return(
    <Modal onClose={onClose} title={initial?t('edit'):t('new_invoice')}>
      <div style={{display:'flex',flexDirection:'column',gap:'1rem'}}>
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'0.75rem'}}>
          <Field label={t('clients')}>
            <select value={f.clientId} onChange={e=>setF({...f,clientId:e.target.value})} style={INP}>
              {data.clients.map(c=><option key={c.id} value={c.id}>{c.name}</option>)}
            </select>
          </Field>
          <Field label={t('currency')}>
            <select value={f.currency} onChange={e=>setF({...f,currency:e.target.value})} style={INP}>
              {curList(st).map(c=><option key={c.code} value={c.code}>{c.code}</option>)}
            </select>
          </Field>
        </div>

        {/* line editor */}
        <Field label={t('items')}>
          <div style={{display:'flex',flexDirection:'column',gap:'0.4rem'}}>
            {f.lines.map((l,n)=>(
              <div key={l.id} style={{background:B.inputBg,border:`1px solid ${B.border}`,borderRadius:'0.875rem',padding:'0.6rem'}}>
                <div style={{display:'flex',alignItems:'center',gap:'0.4rem',marginBottom:'0.4rem'}}>
                  <span style={{fontSize:'0.62rem',color:B.muted,fontWeight:'800',width:'1.1rem'}}>{n+1}</span>
                  <input value={l.desc} onChange={e=>setLine(l.id,'desc',e.target.value)} placeholder={t('designation')} style={{...mini,flex:1}}/>
                  <button onClick={()=>delLine(l.id)} style={{padding:'0.3rem',border:'none',background:'none',cursor:'pointer',display:'flex',flexShrink:0}}><Ic n="trash" size={12} color={B.danger}/></button>
                </div>
                <div style={{display:'grid',gridTemplateColumns:'4rem 1fr auto',gap:'0.4rem',alignItems:'center'}}>
                  <input type="number" inputMode="decimal" value={l.qty} onChange={e=>setLine(l.id,'qty',e.target.value)} placeholder={t('qty')} style={{...mini,textAlign:'center'}}/>
                  <input type="number" inputMode="decimal" value={l.pu} onChange={e=>setLine(l.id,'pu',e.target.value)} placeholder={t('unit_price')} style={mini}/>
                  <span style={{fontSize:'0.78rem',fontWeight:'800',color:B.text,fontVariantNumeric:'tabular-nums',minWidth:'4.5rem',textAlign:_lang==='ar'?'left':'right'}}>
                    {fmt(Number(l.qty||0)*Number(l.pu||0))}
                  </span>
                </div>
              </div>
            ))}
            <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'0.4rem'}}>
              <button onClick={addBlank} style={{padding:'0.55rem',borderRadius:'0.75rem',border:`1px dashed ${B.border}`,background:'transparent',color:B.textSub,fontWeight:'700',fontSize:'0.74rem',cursor:'pointer'}}>+ {t('custom_line')}</button>
              <button onClick={()=>setPick(p=>!p)} style={{padding:'0.55rem',borderRadius:'0.75rem',border:`1px dashed ${pick?B.accentBorder:B.border}`,background:pick?B.accentSoft:'transparent',color:pick?B.accent:B.textSub,fontWeight:'700',fontSize:'0.74rem',cursor:'pointer'}}>+ {t('from_videos')}</button>
            </div>
            {pick&&(
              <div style={{border:`1px solid ${B.border}`,borderRadius:'0.875rem',maxHeight:'10rem',overflowY:'auto',background:B.inputBg}}>
                {pool.filter(v=>!taken.has(v.id)).length===0
                  ?<div style={{padding:'1rem',textAlign:'center',color:B.muted,fontSize:'0.75rem'}}>{t('no_unbilled')}</div>
                  :pool.filter(v=>!taken.has(v.id)).map(v=>(
                    <button key={v.id} onClick={()=>addVideo(v)} style={{width:'100%',display:'flex',alignItems:'center',gap:'0.5rem',padding:'0.55rem 0.7rem',borderBottom:`1px solid ${B.border}`,background:'none',border:'none',cursor:'pointer',textAlign:_lang==='ar'?'right':'left'}}>
                      <div style={{flex:1,minWidth:0}}>
                        <div style={{fontSize:'0.76rem',fontWeight:'600',color:B.text,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{v.title||'—'}</div>
                        <div style={{fontSize:'0.62rem',color:B.muted,fontVariantNumeric:'tabular-nums'}}>{fmtD(v.date)}</div>
                      </div>
                      <span style={{fontSize:'0.76rem',fontWeight:'800',color:B.accent,fontVariantNumeric:'tabular-nums'}}>{fmt(v.price)}</span>
                    </button>
                  ))}
              </div>
            )}
          </div>
        </Field>

        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'0.75rem'}}>
          <Field label={t('issue_date')}><input type="date" value={f.date} onChange={e=>setF({...f,date:e.target.value})} style={INP}/></Field>
          <Field label={t('due_date')}><input type="date" value={f.due} onChange={e=>setF({...f,due:e.target.value})} style={INP}/></Field>
        </div>
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'0.75rem'}}>
          <Field label={t('discount')}><input type="number" inputMode="decimal" value={f.discount} onChange={e=>setF({...f,discount:e.target.value})} placeholder="0" style={INP}/></Field>
          <Field label={t('vat_rate')}><input type="number" inputMode="decimal" value={f.vat} onChange={e=>setF({...f,vat:e.target.value})} style={INP}/></Field>
        </div>
        <Field label={t('period')}><input value={f.period} onChange={e=>setF({...f,period:e.target.value})} placeholder={_lang==='ar'?'سبتمبر 2026':'September 2026'} style={INP}/></Field>
        <Field label={t('invoice_object')}><input value={f.object} onChange={e=>setF({...f,object:e.target.value})} placeholder={t('invoice_object_ph')} style={INP}/></Field>
        <Field label={t('payment_mode')}><input value={f.paymentMode} onChange={e=>setF({...f,paymentMode:e.target.value})} placeholder={t('payment_mode_ph')} style={INP}/></Field>

        <div style={{background:B.inputBg,border:`1px solid ${B.border}`,borderRadius:'0.875rem',padding:'0.85rem 1rem'}}>
          {[[t('amount_ht'),ht],[`${t('amount_vat')} ${Number(f.vat||0)>0?`(${f.vat}%)`:''}`,vat]].map(([k,v])=>(
            <div key={k} style={{display:'flex',justifyContent:'space-between',fontSize:'0.75rem',color:B.textSub,marginBottom:'0.3rem'}}>
              <span>{k}</span><span style={{fontVariantNumeric:'tabular-nums'}}>{money(v,cur)}</span>
            </div>
          ))}
          <div style={{display:'flex',justifyContent:'space-between',paddingTop:'0.45rem',borderTop:`1px solid ${B.border}`,fontWeight:'900',color:B.text}}>
            <span>{t('amount_ttc')}</span><span style={{fontVariantNumeric:'tabular-nums',color:B.accent}}>{money(ht+vat,cur)}</span>
          </div>
        </div>

        {err&&<div style={{fontSize:'0.75rem',color:B.danger,fontWeight:'700',padding:'0.5rem 0.75rem',background:B.dangerSoft,borderRadius:'0.5rem'}}>{err}</div>}
        <button onClick={submit} style={{width:'100%',padding:'0.9rem',borderRadius:'0.875rem',background:`linear-gradient(135deg,${B.accent},${ACC2})`,color:'white',fontWeight:'800',border:'none',cursor:'pointer',boxShadow:`0 4px 16px ${B.accent}44`}}>{initial?t('save'):t('new_invoice')}</button>
      </div>
    </Modal>
  );
}

function InvoicesTab({data,agency,addInvoice,updInvoice,delInvoice,payInvoice}){
  const st=data.settings;
  const[showForm,setShowForm]=useState(false);const[editing,setEditing]=useState(null);const[viewing,setViewing]=useState(null);
  const[fS,setFS]=useState('');
  const cMap=Object.fromEntries(data.clients.map(c=>[c.id,c.name]));
  const list=useMemo(()=>fS?data.invoices.filter(i=>i.status===fS):data.invoices,[data.invoices,fS]);
  // totals stay split by currency — a single blended number would be a lie
  const totals=useMemo(()=>{
    const all={},open={};
    data.invoices.forEach(i=>{
      const c=invCur(i,st), v=invTotals(i,data.videos).ttc;
      all[c]=(all[c]||0)+v;
      if(i.status!=='paid')open[c]=(open[c]||0)+v;
    });
    return{all,open};
  },[data.invoices,data.videos,st]);
  const statusColor=s=>({draft:B.textSub,sent:B.blue,paid:B.success}[s]||B.textSub);
  const statusBg=s=>({draft:_theme==='dark'?'rgba(255,255,255,0.06)':'rgba(0,0,0,0.05)',sent:B.blueSoft,paid:B.successSoft}[s]);
  const show=m=>{const k=Object.keys(m);return k.length?k.map(c=>money(m[c],c)).join(' · '):money(0,curBase(st));};

  if(data.clients.length===0)return(
    <div style={{background:B.card,border:`1px solid ${B.border}`,borderRadius:'1.25rem',padding:'3rem 1.5rem',textAlign:'center'}}>
      <div style={{fontSize:'2.5rem',marginBottom:'0.75rem',opacity:0.5}}>🧾</div>
      <div style={{color:B.textSub,fontSize:'0.875rem'}}>{t('no_clients')}</div>
    </div>
  );

  return(
    <div style={{display:'flex',flexDirection:'column',gap:'1.25rem'}}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',gap:'0.75rem'}}>
        <div>
          <h2 style={{fontSize:'1.75rem',fontWeight:'900',color:B.text}}>{t('invoices')}</h2>
          <p style={{fontSize:'0.75rem',color:B.textSub,fontVariantNumeric:'tabular-nums'}}>{data.invoices.length}</p>
        </div>
        <button onClick={()=>{setEditing(null);setShowForm(true);}} style={{display:'flex',alignItems:'center',gap:'0.4rem',padding:'0.65rem 1.1rem',borderRadius:'9999px',background:`linear-gradient(135deg,${B.accent},${ACC2})`,color:'white',fontWeight:'700',border:'none',cursor:'pointer',fontSize:'0.8rem',whiteSpace:'nowrap',boxShadow:`0 4px 16px ${B.accent}44`}}>
          <Ic n="plus" size={15} color="white"/>{t('new_invoice')}
        </button>
      </div>
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'0.65rem'}}>
        <StatCard label={t('total_invoiced')} value={show(totals.all)} ic="receipt" color={B.accent}/>
        <StatCard label={t('awaiting')} value={show(totals.open)} ic="clock" color={B.textSub}/>
      </div>
      <div style={{display:'flex',gap:'0.4rem',flexWrap:'wrap'}}>
        {[['',t('all')],['draft',t('st_draft')],['sent',t('st_sent')],['paid',t('st_paid')]].map(([v,l])=>(
          <button key={v||'all'} onClick={()=>setFS(v)} style={{padding:'0.42rem 0.9rem',borderRadius:'9999px',border:`1px solid ${fS===v?B.accentBorder:B.border}`,background:fS===v?B.accentSoft:B.card,color:fS===v?B.accent:B.textSub,fontWeight:'700',fontSize:'0.75rem',cursor:'pointer'}}>{l}</button>
        ))}
      </div>
      <div style={{background:B.card,borderRadius:'1.25rem',border:`1px solid ${B.border}`,overflow:'hidden'}}>
        {list.length===0?<div style={{padding:'3rem 1rem',textAlign:'center'}}>
          <div style={{fontSize:'2.5rem',marginBottom:'0.75rem',opacity:0.5}}>🧾</div>
          <div style={{color:B.textSub,fontSize:'0.875rem'}}>{t('no_invoices')}</div>
        </div>
        :list.map(inv=>{
          const{ttc,lines}=invTotals(inv,data.videos);
          const late=inv.due&&inv.status!=='paid'&&inv.due<today();
          return(
            <div key={inv.id} style={{padding:'0.9rem 1rem',borderBottom:`1px solid ${B.border}`,position:'relative'}}>
              <div style={{position:'absolute',right:0,top:0,bottom:0,width:'3px',background:statusColor(inv.status)}}/>
              <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',gap:'0.6rem'}}>
                <div style={{flex:1,minWidth:0}}>
                  <div style={{display:'flex',alignItems:'center',gap:'0.4rem',flexWrap:'wrap'}}>
                    <span style={{fontWeight:'800',color:B.text,fontSize:'0.88rem',fontVariantNumeric:'tabular-nums'}}>{inv.number}</span>
                    <span style={{fontSize:'0.58rem',fontWeight:'800',padding:'0.12rem 0.5rem',borderRadius:'9999px',background:statusBg(inv.status),color:statusColor(inv.status)}}>{t(INV_STATUS[inv.status]?.k||'st_draft')}</span>
                    {late&&<span style={{fontSize:'0.58rem',fontWeight:'800',padding:'0.12rem 0.5rem',borderRadius:'9999px',background:B.dangerSoft,color:B.danger}}>{t('overdue')}</span>}
                  </div>
                  <div style={{fontSize:'0.68rem',color:B.muted,marginTop:'3px',display:'flex',gap:'0.4rem',flexWrap:'wrap'}}>
                    <span>{cMap[inv.clientId]||'—'}</span><span>·</span>
                    <span>{lines.length} {t('items')}</span><span>·</span>
                    <span style={{fontVariantNumeric:'tabular-nums'}}>{fmtD(inv.date)}</span>
                  </div>
                </div>
                <div style={{textAlign:_lang==='ar'?'left':'right',flexShrink:0}}>
                  <div style={{fontWeight:'900',fontSize:'1rem',color:B.text,fontVariantNumeric:'tabular-nums'}}>{money(ttc,invCur(inv,st))}</div>
                </div>
              </div>
              <div style={{display:'flex',gap:'0.35rem',marginTop:'0.7rem',flexWrap:'wrap'}}>
                <button onClick={()=>setViewing(inv)} style={{display:'flex',alignItems:'center',gap:'0.3rem',padding:'0.34rem 0.7rem',borderRadius:'9999px',border:`1px solid ${B.border}`,background:'transparent',color:B.textSub,fontWeight:'700',fontSize:'0.68rem',cursor:'pointer'}}>
                  <Ic n="printer" size={12}/>{t('print_inv')}
                </button>
                {inv.status!=='paid'&&(
                  <>
                    {inv.status==='draft'&&<button onClick={()=>updInvoice(inv.id,{status:'sent'})} style={{padding:'0.34rem 0.7rem',borderRadius:'9999px',border:`1px solid ${B.blueSoft}`,background:B.blueSoft,color:B.blue,fontWeight:'700',fontSize:'0.68rem',cursor:'pointer'}}>{t('st_sent')}</button>}
                    <button onClick={()=>payInvoice(inv.id)} style={{display:'flex',alignItems:'center',gap:'0.3rem',padding:'0.34rem 0.7rem',borderRadius:'9999px',border:`1px solid ${B.successSoft}`,background:B.successSoft,color:B.success,fontWeight:'700',fontSize:'0.68rem',cursor:'pointer'}}>
                      <Ic n="check" size={12} color={B.success}/>{t('st_paid')}
                    </button>
                  </>
                )}
                <div style={{flex:1}}/>
                <button onClick={()=>{setEditing(inv);setShowForm(true);}} style={{padding:'0.34rem',border:'none',background:'none',cursor:'pointer',color:B.muted,display:'flex'}}><Ic n="pencil" size={13}/></button>
                <button onClick={()=>delInvoice(inv.id)} style={{padding:'0.34rem',border:'none',background:'none',cursor:'pointer',display:'flex'}}><Ic n="trash" size={13} color={B.danger}/></button>
              </div>
            </div>
          );
        })}
      </div>
      {showForm&&<InvoiceForm data={data} initial={editing}
        onClose={()=>{setShowForm(false);setEditing(null);}}
        onSave={f=>{if(editing)updInvoice(editing.id,f);else addInvoice(f);setShowForm(false);setEditing(null);}}/>}
      {viewing&&<InvoiceSheet inv={viewing} data={data} agency={agency} onClose={()=>setViewing(null)}/>}
    </div>
  );
}

// ─── TASKS ────────────────────────────────────────────────
function TaskForm({editors,clients,initial,solo,onClose,onSave}){

  const submit=()=>{if(!f.title.trim())return setErr(t('task_title'));onSave({...f,title:f.title.trim()});};

    <Modal onClose={onClose} title={initial?t('edit'):t('new_task')}>
      <div style={{display:'flex',flexDirection:'column',gap:'1rem'}}>
        <Field label={t('task_title')}>
          <input value={f.title} onChange={e=>setF({...f,title:e.target.value})} placeholder={t('task_title_ph')} style={INP} autoFocus/>
        </Field>
        <div style={{display:'grid',gridTemplateColumns:solo?'1fr':'1fr 1fr',gap:'0.75rem'}}>
          {!solo&&<Field label={t('assigned_to')}>
            <select value={f.editorId} onChange={e=>setF({...f,editorId:e.target.value})} style={INP}>
              <option value="">{t('unassigned')}</option>
              {editors.map(e=><option key={e.id} value={e.id}>{e.name}</option>)}

          </Field>}
          <Field label={t('clients')}>
            <select value={f.clientId} onChange={e=>setF({...f,clientId:e.target.value})} style={INP}>
              <option value="">—</option>
              {clients.map(c=><option key={c.id} value={c.id}>{c.name}</option>)}
            </select>
          </Field>
        </div>
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'0.75rem'}}>
          <Field label={t('due_date')}><input type="date" value={f.due} onChange={e=>setF({...f,due:e.target.value})} style={INP}/></Field>

            <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'0.4rem'}}>
