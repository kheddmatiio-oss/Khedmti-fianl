function TasksTab({data,addTask,updTask,delTask,solo,readOnlyFor}){
  const[showForm,setShowForm]=useState(false);const[editing,setEditing]=useState(null);
  const[fS,setFS]=useState('open');
  const eMap=Object.fromEntries(data.editors.map(e=>[e.id,e.name]));
  const cMap=Object.fromEntries(data.clients.map(c=>[c.id,c.name]));
  const td=today();
  const list=useMemo(()=>{
    let l=data.tasks;
    if(readOnlyFor)l=l.filter(k=>k.editorId===readOnlyFor);
    if(fS==='open')l=l.filter(k=>k.status!=='done');
    else if(fS!=='all')l=l.filter(k=>k.status===fS);
    // urgent and overdue float up, then nearest deadline
    const rank=k=>(k.status==='doing'?0:1);
    return [...l].sort((a,b)=>rank(a)-rank(b)||(b.priority==='high')-(a.priority==='high')||String(a.due||'9999').localeCompare(String(b.due||'9999')));
  },[data.tasks,fS,readOnlyFor]);
  const counts={open:data.tasks.filter(k=>k.status!=='done').length,done:data.tasks.filter(k=>k.status==='done').length};
  const cycle=k=>updTask(k.id,{status:k.status==='todo'?'doing':k.status==='doing'?'done':'todo'});
  const chips=[['open',t('open_tasks'),counts.open],['done',t('t_done'),counts.done],['all',t('all'),data.tasks.length]];
  return(
    <div style={{display:'flex',flexDirection:'column',gap:'1.25rem'}}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',gap:'0.75rem'}}>
        <div>
          <h2 style={{fontSize:'1.75rem',fontWeight:'900',color:B.text}}>{readOnlyFor?t('my_tasks'):t('tasks')}</h2>
          <p style={{fontSize:'0.75rem',color:B.textSub,fontVariantNumeric:'tabular-nums'}}>{counts.open} {t('open_tasks')}</p>
        </div>
        <button onClick={()=>{setEditing(null);setShowForm(true);}} style={{display:'flex',alignItems:'center',gap:'0.4rem',padding:'0.65rem 1.1rem',borderRadius:'9999px',background:`linear-gradient(135deg,${B.accent},${ACC2})`,color:'white',fontWeight:'700',border:'none',cursor:'pointer',fontSize:'0.8rem',whiteSpace:'nowrap',boxShadow:`0 4px 16px ${B.accent}44`}}>
          <Ic n="plus" size={15} color="white"/>{t('new_task')}
        </button>
      </div>
      <div style={{display:'flex',gap:'0.4rem',flexWrap:'wrap'}}>
        {chips.map(([v,l,n])=>(
          <button key={v} onClick={()=>setFS(v)} style={{display:'flex',alignItems:'center',gap:'0.35rem',padding:'0.42rem 0.85rem',borderRadius:'9999px',border:`1px solid ${fS===v?B.accentBorder:B.border}`,background:fS===v?B.accentSoft:B.card,color:fS===v?B.accent:B.textSub,fontWeight:'700',fontSize:'0.75rem',cursor:'pointer'}}>
            {l}<span style={{fontVariantNumeric:'tabular-nums',opacity:0.7}}>{n}</span>
          </button>
        ))}
      </div>
      <div style={{background:B.card,borderRadius:'1.25rem',border:`1px solid ${B.border}`,overflow:'hidden'}}>
        {list.length===0?<div style={{padding:'3rem 1rem',textAlign:'center'}}>
          <div style={{fontSize:'2.5rem',marginBottom:'0.75rem',opacity:0.5}}>🗒️</div>
          <div style={{color:B.textSub,fontSize:'0.875rem'}}>{t('no_tasks')}</div>
        </div>
        :list.map(k=>{
          const late=k.due&&k.status!=='done'&&k.due<td;
          const dueToday=k.due===td&&k.status!=='done';
          const sc=tStatusColor(k.status);
          return(
            <div key={k.id} style={{padding:'0.85rem 1rem',borderBottom:`1px solid ${B.border}`,display:'flex',alignItems:'flex-start',gap:'0.75rem',position:'relative'}}>
              <div style={{position:'absolute',right:0,top:0,bottom:0,width:'3px',background:k.priority==='high'&&k.status!=='done'?B.danger:sc,opacity:k.status==='done'?0.4:1}}/>
              <button onClick={()=>cycle(k)} title={tStatusLabel(k.status)} style={{marginTop:'2px',flexShrink:0,width:'1.4rem',height:'1.4rem',borderRadius:'0.5rem',border:`2px solid ${sc}`,background:k.status==='done'?sc:'transparent',cursor:'pointer',display:'grid',placeItems:'center',padding:0}}>
                {k.status==='done'&&<Ic n="check" size={11} color={'#fff'}/>}
                {k.status==='doing'&&<div style={{width:'6px',height:'6px',borderRadius:'50%',background:sc}}/>}
              </button>
              <div style={{flex:1,minWidth:0}}>
                <div style={{display:'flex',alignItems:'center',gap:'0.4rem',flexWrap:'wrap'}}>
                  <span style={{fontWeight:'700',color:k.status==='done'?B.muted:B.text,fontSize:'0.88rem',textDecoration:k.status==='done'?'line-through':'none'}}>{k.title}</span>
                  {k.priority==='high'&&k.status!=='done'&&<span style={{fontSize:'0.56rem',fontWeight:'800',padding:'0.1rem 0.4rem',borderRadius:'9999px',background:B.dangerSoft,color:B.danger}}>{t('p_high')}</span>}
                </div>
                <div style={{fontSize:'0.68rem',color:B.muted,display:'flex',gap:'0.4rem',flexWrap:'wrap',marginTop:'2px',alignItems:'center'}}>
                  <span style={{color:sc,fontWeight:'700'}}>{tStatusLabel(k.status)}</span>
                  {!solo&&!readOnlyFor&&<><span>·</span><span>{eMap[k.editorId]||t('unassigned')}</span></>}
                  {k.clientId&&<><span>·</span><span>{cMap[k.clientId]||'—'}</span></>}
                  {k.due&&<><span>·</span><span style={{fontVariantNumeric:'tabular-nums',color:late?B.danger:dueToday?B.warning:B.muted,fontWeight:late||dueToday?'700':'400'}}>{late?`${t('overdue')} · `:dueToday?`${t('due_today')} · `:''}{fmtD(k.due)}</span></>}
                </div>
                {k.notes&&<div style={{fontSize:'0.68rem',color:B.muted,marginTop:'3px',opacity:0.8}}>{k.notes}</div>}
              </div>
              <div style={{display:'flex',gap:'0.1rem',flexShrink:0}}>
                <button onClick={()=>{setEditing(k);setShowForm(true);}} style={{padding:'0.4rem',border:'none',background:'none',cursor:'pointer',color:B.muted,display:'flex'}}><Ic n="pencil" size={13}/></button>
                <button onClick={()=>delTask(k.id)} style={{padding:'0.4rem',border:'none',background:'none',cursor:'pointer',display:'flex'}}><Ic n="trash" size={13} color={B.danger}/></button>
              </div>
            </div>
          );
        })}
      </div>
      {showForm&&<TaskForm editors={data.editors} clients={data.clients} initial={editing} solo={solo}
        onClose={()=>{setShowForm(false);setEditing(null);}}
        onSave={f=>{if(editing)updTask(editing.id,f);else addTask(readOnlyFor?{...f,editorId:readOnlyFor}:f);setShowForm(false);setEditing(null);}}/>}
    </div>
  );
}

// ─── ROOT ─────────────────────────────────────────────────
function App(){
  const[screen,setScreen]=useState('landing');
  const[agency,setAgency]=useState(null);
  const[worker,setWorker]=useState(null);
  const[workerData,setWorkerData]=useState(null);

  // A cached session is only a hint — the token decides. Without one we
  // land on the marketing page rather than a shell with no data behind it.
  useEffect(()=>{
    const s=localStorage.getItem('_session');
    if(!s||!DB.hasSession())return;
    try{
      const p=JSON.parse(s);
      const dead=ag=>isSuspended(ag)||(isExpired(ag)&&ag.plan!=='free');
      if(p.type==='superadmin')setScreen('superadmin');
      else if(p.type==='agency'&&p.agency){
        setAgency(p.agency);setScreen(dead(p.agency)?'expired':'agency');
      }
      else if(p.type==='worker'&&p.agency&&p.worker){
        setAgency(p.agency);
        if(dead(p.agency))setScreen('expired');
        else{setWorker(p.worker);setWorkerData(p.workerData);setScreen('worker');}
      }
    }catch(e){}
  },[]);

  const save=s=>localStorage.setItem('_session',JSON.stringify(s));

  const onAgency=ag=>{
    if(isSuspended(ag)||isExpired(ag)&&ag.plan!=='free'){setAgency(ag);setScreen('expired');return;}
    setAgency(ag);save({type:'agency',agency:ag});setScreen('agency');
  };
  const onWorker=(ag,w,d)=>{
    if(isSuspended(ag)||isExpired(ag)&&ag.plan!=='free'){setAgency(ag);setScreen('expired');return;}
    setAgency(ag);setWorker(w);setWorkerData(d);save({type:'worker',agency:ag,worker:w,workerData:d});setScreen('worker');
  };
  const onSuper=()=>{save({type:'superadmin'});setScreen('superadmin');};
  const logout=async()=>{
    await DB.logout();
    localStorage.removeItem('_session');
    setAgency(null);setWorker(null);setWorkerData(null);setScreen('landing');
  };

  const isConnErr=s=>s&&(s.includes('Failed to fetch')||s.includes('تعذّر الاتصال'));

  const screenEl=(()=>{
  if(screen==='landing')return<Landing onLogin={()=>setScreen('login')} onRegister={()=>setScreen('register')}/>;
  if(screen==='register')return<Register onBack={()=>setScreen('landing')} onSuccess={onAgency}/>;
  if(screen==='login')return<Login onBack={()=>setScreen('landing')} onAgencyLogin={onAgency} onWorkerLogin={onWorker} onSuperAdmin={onSuper}/>;
  if(screen==='superadmin')return<SuperAdmin onLogout={logout}/>;
  if(screen==='expired'&&agency)return<ExpiredScreen agency={agency} onLogout={logout}/>;
  if(screen==='agency'&&agency)return<AgencyApp agency={agency} onLogout={logout}/>;
  if(screen==='worker'&&worker&&agency)return<WorkerApp agency={agency} worker={worker} initialData={workerData} onLogout={logout}/>;
  return null;
  })();
  return <>{screenEl}{LOCAL&&<LocalBadge/>}</>;
}

// Local data must never be mistaken for the real account.
function LocalBadge(){
  const leave=()=>{
    if(!confirm('ترجع للسيرفر؟ البيانات المحلية تبقى محفوظة.'))return;
    setLocal(false);localStorage.removeItem('_session');location.reload();
  };
  return(
    <div style={{position:'fixed',bottom:'0.7rem',left:'0.7rem',zIndex:70,display:'flex',alignItems:'center',gap:'0.5rem',padding:'0.4rem 0.5rem 0.4rem 0.8rem',borderRadius:'9999px',background:B.card,border:`1px solid ${B.accentBorder}`,boxShadow:'0 6px 20px rgba(0,0,0,0.35)',fontSize:'0.66rem',fontWeight:'800',color:B.accent}}>
      🧪 وضع تجريبي محلي
      <button onClick={leave} title="ارجع للسيرفر" style={{display:'flex',padding:'0.25rem',borderRadius:'50%',border:'none',background:B.accentSoft,color:B.accent,cursor:'pointer'}}>
        <Ic n="x" size={11}/>
      </button>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
