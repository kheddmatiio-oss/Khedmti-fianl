// wrap fetch errors with friendly message
const wrapFetch=async fn=>{
  try{return await fn();}
  catch(e){
    const msg=e?.message||'';
    if(msg.includes('Failed to fetch')||msg.includes('NetworkError')||msg.includes('fetch')){
      throw new Error('❌ تعذّر الاتصال بالسيرفر. تحقق من الإنترنت أو حاول مجدداً.');
    }
    throw e;
  }
};
const DB={
  async register(name,email,password,phone='',accType='agency'){
    return wrapFetch(async()=>{
      const{data,error}=await sb.from('agencies').insert({name,email,password_hash:hash(password),phone,account_type:accType}).select().single();
      if(error)throw error;
      await sb.from('app_data').insert({agency_id:data.id,data:EMPTY});
      return data;
    });
  },
  async loginAgency(email,password){
    return wrapFetch(async()=>{
      const{data,error}=await sb.from('agencies').select('*').eq('email',email).single();
      if(error||!data)throw new Error(t('err_not_found'));
      if(data.password_hash!==hash(password))throw new Error(t('err_wrong_pw'));
      return data;
    });
  },
  async loginWorker(agencyEmail,workerPassword){
    return wrapFetch(async()=>{
      const{data:ag,error:agErr}=await sb.from('agencies').select('*').eq('email',agencyEmail.toLowerCase().trim()).single();
      if(agErr||!ag)throw new Error(t('err_no_agency'));
      const{data:appData}=await sb.from('app_data').select('data').eq('agency_id',ag.id).single();
      const d=appData?.data||EMPTY;
      const worker=d.editors.find(e=>e.password===hash(workerPassword));
      if(!worker)throw new Error(t('err_wrong_pw'));
      return{agency:ag,worker,appData:d};
    });
  },
  async loadData(agencyId){
    return wrapFetch(async()=>{
      const{data}=await sb.from('app_data').select('data').eq('agency_id',agencyId).single();
      return data?.data||{...EMPTY};
    });
  },
  async saveData(agencyId,data){
    const{data:updated,error}=await sb.from('app_data').update({data,updated_at:new Date().toISOString()}).eq('agency_id',agencyId).select();
    if(error)throw error;
    if(!updated||updated.length===0){
      await sb.from('app_data').insert({agency_id:agencyId,data});
    }
  },
  async getAllAgencies(){
    const{data}=await sb.from('agencies').select('*').order('created_at',{ascending:false});
    return data||[];
  },
  async getAgencyData(agencyId){
    const{data}=await sb.from('app_data').select('data').eq('agency_id',agencyId).single();
    return data?.data||{...EMPTY};
  },
  async updateAgency(id,patch){await sb.from('agencies').update(patch).eq('id',id);},
  async deleteAgency(id){
    await sb.from('app_data').delete().eq('agency_id',id);
    await sb.from('agencies').delete().eq('id',id);
  }
};

function Register({onBack,onSuccess}){
  const[name,setName]=useState('');const[email,setEmail]=useState('');
  const[phone,setPhone]=useState('');const[pw,setPw]=useState('');
  const[accType,setAccType]=useState('agency');
  const[show,setShow]=useState(false);const[err,setErr]=useState('');const[loading,setLoading]=useState(false);
  const[connErr,setConnErr]=useState(false);
  if(connErr)return<ConnError onRetry={()=>setConnErr(false)}/>;
  const submit=async()=>{
    if(!name.trim())return setErr(t('err_name'));
    if(!email.includes('@'))return setErr(t('err_email'));
    if(pw.length<4)return setErr(t('err_pw'));
    setLoading(true);setErr('');
    try{const ag=await DB.register(name.trim(),email.toLowerCase().trim(),pw,phone.trim(),accType);onSuccess(ag);}
    catch(e){
      const msg=e.message||'';
      if(msg.includes('تعذّر')||msg.includes('fetch'))setConnErr(true);
      else setErr(msg.includes('duplicate')||msg.includes('unique')?t('err_duplicate'):msg);
    }
    finally{setLoading(false);}
  };
  return(
    <AuthShell title={t('register')}>
      <div style={{display:'flex',flexDirection:'column',gap:'1rem'}}>
        <Field label={t('acc_type')}>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'0.5rem'}}>
            {[{v:'agency',l:t('agency'),h:t('agency_hint'),ic:'building'},{v:'solo',l:t('solo'),h:t('solo_hint'),ic:'video'}].map(o=>(
              <button key={o.v} onClick={()=>setAccType(o.v)}
                style={{padding:'0.75rem 0.5rem',borderRadius:'0.875rem',border:`2px solid ${accType===o.v?B.accent:B.border}`,background:accType===o.v?B.accentSoft:'transparent',cursor:'pointer',textAlign:'center'}}>
                <div style={{display:'flex',alignItems:'center',justifyContent:'center',gap:'0.4rem',fontWeight:'800',fontSize:'0.82rem',color:accType===o.v?B.accent:B.text}}>
                  <Ic n={o.ic} size={14} color={accType===o.v?B.accent:B.muted}/>{o.l}
                </div>
                <div style={{fontSize:'0.6rem',color:B.muted,marginTop:'0.25rem',lineHeight:1.4}}>{o.h}</div>
              </button>
            ))}
          </div>
        </Field>
        <Field label={accType==='solo'?t('your_name'):t('agency_name')}>

// ─── LOGIN ────────────────────────────────────────────────
function Login({onBack,onAgencyLogin,onWorkerLogin,onSuperAdmin}){
  const[role,setRole]=useState('agency');
  const[email,setEmail]=useState('');const[agEmail,setAgEmail]=useState('');
  const[pw,setPw]=useState('');const[show,setShow]=useState(false);
  const[err,setErr]=useState('');const[loading,setLoading]=useState(false);
  const[connErr,setConnErr]=useState(false);
  if(connErr)return<ConnError onRetry={()=>setConnErr(false)}/>;
  const submit=async()=>{
    if(!pw)return setErr(t('password'));
    setLoading(true);setErr('');
    if(email===SUPER_EMAIL&&pw===SUPER_PASS){setLoading(false);onSuperAdmin();return;}
    try{
      if(role==='agency'){
        if(!email.includes('@'))return setErr(t('err_email'));
        const ag=await DB.loginAgency(email.toLowerCase().trim(),pw);
        onAgencyLogin(ag);
      } else {
        if(!agEmail.includes('@'))return setErr(t('err_email'));
        const{agency,worker,appData}=await DB.loginWorker(agEmail,pw);
        onWorkerLogin(agency,worker,appData);
      }
    }catch(e){
      const msg=e.message||'';
      if(msg.includes('تعذّر')||msg.includes('fetch')){setConnErr(true);}
      else setErr(msg);
    }
    finally{setLoading(false);}
  };
  return(
    <AuthShell title={t('login')}>
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'0.375rem',padding:'0.25rem',background:B.inputBg,borderRadius:'0.75rem',marginBottom:'1.25rem'}}>
        {[{v:'agency',l:t('agency'),ic:'building'},{v:'worker',l:t('worker'),ic:'video'}].map(r=>(
          <button key={r.v} onClick={()=>{setRole(r.v);setErr('');setPw('');}}
            style={{padding:'0.625rem',borderRadius:'0.5rem',fontWeight:'700',fontSize:'0.875rem',display:'flex',alignItems:'center',justifyContent:'center',gap:'0.5rem',border:'none',cursor:'pointer',background:role===r.v?B.accent:'transparent',color:role===r.v?'white':B.muted,transition:'all 0.15s'}}>
            <Ic n={r.ic} size={15}/>{r.l}
          </button>
        ))}
      </div>
      <div style={{display:'flex',flexDirection:'column',gap:'1rem'}}>
        {role==='agency'?(
          <Field label={t('email')}>
            <div style={{position:'relative'}}>
              <div style={{position:'absolute',right:'0.75rem',top:'50%',transform:'translateY(-50%)',display:'flex',pointerEvents:'none'}}><Ic n="mail" size={14} color={B.muted}/></div>
              <input type="email" value={email} onChange={e=>setEmail(e.target.value)} placeholder="agency@email.com" style={{...INP,paddingRight:'2.5rem'}}/>
            </div>
          </Field>
        ):(
          <>
            <Field label={t('agency_email')}>
              <div style={{position:'relative'}}>
                <div style={{position:'absolute',right:'0.75rem',top:'50%',transform:'translateY(-50%)',display:'flex',pointerEvents:'none'}}><Ic n="building" size={14} color={B.muted}/></div>
                <input type="email" value={agEmail} onChange={e=>setAgEmail(e.target.value)} placeholder={t('worker_email_hint')} style={{...INP,paddingRight:'2.5rem'}}/>
              </div>
            </Field>
            <div style={{padding:'0.5rem 0.75rem',background:B.accentSoft,border:`1px solid ${B.accent}33`,borderRadius:'0.5rem',fontSize:'0.75rem',color:B.accent}}>
              {t('role_hint')}
            </div>
          </>
        )}
        <Field label={t('password')}>
          <PwField value={pw} onChange={setPw} show={show} setShow={setShow} placeholder={t('password')} onEnter={submit}/>
        </Field>
        {err&&<div style={{fontSize:'0.75rem',color:B.danger,fontWeight:'700',padding:'0.5rem 0.75rem',background:`rgba(239,68,68,0.1)`,borderRadius:'0.5rem',border:`1px solid rgba(239,68,68,0.2)`}}>{err}</div>}
        <button onClick={submit} disabled={loading} style={{width:'100%',padding:'0.9rem',borderRadius:'0.875rem',background:`linear-gradient(135deg,${B.accent},#cc2f0f)`,color:'white',fontWeight:'800',border:'none',cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',gap:'0.5rem',opacity:loading?0.7:1,boxShadow:`0 6px 20px ${B.accent}44`,fontSize:'0.92rem'}}>
          {loading?<><span className="spin" style={{display:'inline-block'}}><Ic n="loader" size={16} color="white"/></span>{t('login')}...</>:t('login')}
        </button>
        <button onClick={onBack} style={{background:'none',border:'none',cursor:'pointer',color:B.muted,fontSize:'0.85rem',textAlign:'center',padding:'0.25rem'}}>{t('back')}</button>
      </div>
    </AuthShell>
  );
}

// ─── SUPER ADMIN ──────────────────────────────────────────
function SuperAdmin({onLogout}){
  const[agencies,setAgencies]=useState([]);
  const[loading,setLoading]=useState(true);
  const[selected,setSelected]=useState(null);
  const[agData,setAgData]=useState(null);
  const[editAg,setEditAg]=useState(null);
  const[toast,setToast]=useState(null);
  const showToast=(msg,type='success')=>{setToast({msg,type});setTimeout(()=>setToast(null),2500);};

  useEffect(()=>{DB.getAllAgencies().then(d=>{setAgencies(d);setLoading(false);});},[]);

  const viewAgency=async ag=>{setSelected(ag);const d=await DB.getAgencyData(ag.id);setAgData(d);};
  const updateAgency=async(id,patch)=>{
    await DB.updateAgency(id,patch);
    setAgencies(a=>a.map(x=>x.id===id?{...x,...patch}:x));
    if(selected?.id===id)setSelected(s=>({...s,...patch}));
    showToast(t('toast_saved'));setEditAg(null);
  };
  const deleteAgency=async id=>{
    if(!confirm(t('confirm_delete')))return;
    await DB.deleteAgency(id);
    setAgencies(a=>a.filter(x=>x.id!==id));
    if(selected?.id===id){setSelected(null);setAgData(null);}
    showToast(t('toast_deleted'));
  };

  const stats={total:agencies.length,active:agencies.filter(a=>a.is_active&&!isExpired(a)).length,paid:agencies.filter(a=>a.plan!=='free').length};

  if(loading)return<div style={{minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center',background:B.bg}}><Logo size={70}/></div>;

  return(
    <div style={{minHeight:'100vh',background:B.bg,fontFamily:"'Tajawal','Cairo',sans-serif"}}>
      <header style={{borderBottom:`1px solid ${B.border}`,background:B.navBg,backdropFilter:'blur(16px)',position:'sticky',top:0,zIndex:40}}>
        <div style={{maxWidth:'80rem',margin:'0 auto',padding:'0.7rem 1rem',display:'flex',alignItems:'center',justifyContent:'space-between'}}>
          <div style={{display:'flex',alignItems:'center',gap:'0.75rem'}}>
            <Logo size={36}/>
            <div>
              <div style={{fontWeight:'800',color:B.text,fontSize:'0.92rem',display:'flex',alignItems:'center',gap:'0.4rem'}}>{t('super_admin')} <Ic n="crown" size={14} color={B.warning}/></div>
              <div style={{fontSize:'0.62rem',color:B.muted}}>{t('admin_panel')}</div>
            </div>
          </div>
          <div style={{display:'flex',alignItems:'center',gap:'0.6rem'}}>
            <SettingsBar/>
            <button onClick={onLogout} style={{padding:'0.45rem 0.9rem',borderRadius:'9999px',border:`1px solid ${B.dangerSoft}`,background:B.dangerSoft,color:B.danger,fontWeight:'700',cursor:'pointer',display:'flex',alignItems:'center',gap:'0.4rem',fontSize:'0.78rem'}}>
              <Ic n="logout" size={13} color={B.danger}/>{t('logout')}
            </button>
          </div>
        </div>
      </header>

      <main style={{maxWidth:'80rem',margin:'0 auto',padding:'1.5rem 1rem'}}>
        <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:'0.75rem',marginBottom:'1.5rem'}}>
          <StatCard label={t('total_agencies')} value={stats.total} ic="building"/>
          <StatCard label={t('active_agencies')} value={stats.active} ic="checkCircle"/>
          <StatCard label={t('paid_subs')} value={stats.paid} ic="crown"/>
        </div>

        <div style={{display:'grid',gridTemplateColumns:selected?'1fr 1fr':'1fr',gap:'1.5rem'}}>
          <div style={{background:B.card,borderRadius:'1rem',border:`1px solid ${B.border}`,overflow:'hidden'}}>
            <div style={{padding:'1rem 1.25rem',borderBottom:`1px solid ${B.border}`,fontWeight:'800',fontSize:'1rem',color:B.text}}>
              {agencies.length} {t('total_agencies').split(' ')[1]||t('total_agencies')}
            </div>
            {agencies.length===0?<div style={{padding:'3rem',textAlign:'center',color:B.muted,fontSize:'0.875rem'}}>{t('no_agencies')}</div>
            :agencies.map(ag=>{
              const pl=planLabel(ag.plan);
              const exp=isExpired(ag);const sus=isSuspended(ag);const dl=daysLeft(ag);
              return(
                <div key={ag.id} style={{padding:'0.875rem 1.25rem',borderBottom:`1px solid ${B.border}`,background:selected?.id===ag.id?_theme==='dark'?'#222':'#f0f0f0':'transparent'}}>
                  <div style={{display:'flex',alignItems:'center',gap:'0.75rem'}}>
                    <div style={{width:'2.5rem',height:'2.5rem',borderRadius:'50%',display:'grid',placeItems:'center',fontWeight:'700',flexShrink:0,background:B.accentSoft,color:B.accent}}>
                      {ag.name.charAt(0)}
                    </div>
                    <div style={{flex:1,minWidth:0}}>
                      <div style={{display:'flex',alignItems:'center',gap:'0.5rem',flexWrap:'wrap'}}>
                        <span style={{fontWeight:'700',color:B.text,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{ag.name}</span>
                        <span style={{fontSize:'0.6rem',fontWeight:'700',padding:'0.1rem 0.4rem',borderRadius:'9999px',background:pl.bg,color:pl.color}}>{pl.label}</span>
                        {sus&&<span style={{fontSize:'0.6rem',fontWeight:'700',padding:'0.1rem 0.4rem',borderRadius:'9999px',background:`rgba(239,68,68,0.15)`,color:B.danger}}>🚫</span>}
                        {exp&&!sus&&<span style={{fontSize:'0.6rem',fontWeight:'700',padding:'0.1rem 0.4rem',borderRadius:'9999px',background:`rgba(239,68,68,0.15)`,color:B.danger}}>⏰</span>}
                      </div>
                      <div style={{fontSize:'0.7rem',color:B.muted}}>{ag.email} {ag.phone&&<span style={{color:B.accent}}>· 📱 {ag.phone}</span>}</div>
                      {dl!==null&&!exp&&<div style={{fontSize:'0.65rem',color:dl<7?B.danger:B.success,fontWeight:'600'}}>{t('days_left',dl)}</div>}
                    </div>
                    <div style={{display:'flex',gap:'0.25rem',flexShrink:0}}>
                      <button onClick={()=>viewAgency(ag)} style={{padding:'0.35rem 0.6rem',border:'none',borderRadius:'0.5rem',background:selected?.id===ag.id?B.accent:B.border,color:selected?.id===ag.id?'white':B.text,cursor:'pointer',fontSize:'0.7rem',fontWeight:'700'}}>
                        {selected?.id===ag.id?t('opened'):t('view')}
                      </button>
                      <button onClick={()=>setEditAg(ag)} style={{padding:'0.35rem',border:'none',background:'none',cursor:'pointer',color:B.muted,display:'flex'}}><Ic n="pencil" size={14}/></button>
                      <button onClick={()=>deleteAgency(ag.id)} style={{padding:'0.35rem',border:'none',background:'none',cursor:'pointer',color:B.danger,display:'flex'}}><Ic n="trash" size={14} color={B.danger}/></button>
                    </div>
                  </div>
                </div>
              );
            })}
          </div>

          {selected&&agData&&(
            <div style={{background:B.card,borderRadius:'1rem',border:`1px solid ${B.border}`,overflow:'hidden'}}>
              <div style={{padding:'1rem 1.25rem',borderBottom:`1px solid ${B.border}`,display:'flex',justifyContent:'space-between',alignItems:'center'}}>
                <div>
                  <div style={{fontWeight:'800',fontSize:'1rem',color:B.text}}>{selected.name}</div>
                  <div style={{fontSize:'0.75rem',color:B.muted}}>{selected.email} {selected.phone&&<span style={{color:B.accent}}>· 📱 {selected.phone}</span>}</div>
                </div>
                <button onClick={()=>{setSelected(null);setAgData(null);}} style={{background:'none',border:'none',cursor:'pointer',display:'flex',color:B.muted}}><Ic n="x" size={18}/></button>
              </div>
              <div style={{padding:'1rem'}}>
                <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:'0.5rem',marginBottom:'1rem'}}>

                      <div style={{fontSize:'0.65rem',color:B.muted}}>{s.l}</div>

                {!agData.videos?.length?<div style={{color:B.muted,fontSize:'0.875rem',textAlign:'center',padding:'1rem'}}>{t('no_videos')}</div>
                :<div style={{maxHeight:'250px',overflowY:'auto'}}>
                  {agData.videos.slice(0,10).map(v=>{
                    const eMap=Object.fromEntries((agData.editors||[]).map(e=>[e.id,e.name]));
                    const cMap=Object.fromEntries((agData.clients||[]).map(c=>[c.id,c.name]));

                      <div key={v.id} style={{padding:'0.6rem',borderBottom:`1px solid ${B.border}`,display:'flex',justifyContent:'space-between',alignItems:'center'}}>

                    );

              </div>
            </div>
          )}
        </div>
      </main>

      {editAg&&<EditAgencyModal ag={editAg} onClose={()=>setEditAg(null)} onSave={(id,patch)=>updateAgency(id,patch)}/>}
      <Toast toast={toast}/>
    </div>
  );
}

function EditAgencyModal({ag,onClose,onSave}){
  const[plan,setPlan]=useState(ag.plan||'free');
  const[days,setDays]=useState('30');
  const[active,setActive]=useState(ag.is_active!==false);
  const[notes,setNotes]=useState(ag.notes||'');
  const save=()=>{
    const patch={plan,is_active:active,notes};
    if(plan!=='free'&&days){const e=new Date();e.setDate(e.getDate()+Number(days));patch.plan_expires_at=e.toISOString();}
    if(plan==='free')patch.plan_expires_at=null;
    onSave(ag.id,patch);
  };
  return(
    <Modal onClose={onClose} title={`${t('manage')}: ${ag.name}`}>
      <div style={{display:'flex',flexDirection:'column',gap:'1rem'}}>
        <Field label={t('plan')}>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:'0.5rem'}}>
            {[{v:'free',l:t('free_plan'),c:B.muted},{v:'basic',l:'Basic ⭐',c:'#fbbf24'},{v:'pro',l:'Pro 💎',c:'#a78bfa'}].map(p=>(
              <button key={p.v} onClick={()=>setPlan(p.v)}
                style={{padding:'0.625rem',borderRadius:'0.75rem',border:`2px solid ${plan===p.v?p.c:B.border}`,background:plan===p.v?`${p.c}22`:'transparent',color:p.c,fontWeight:'700',cursor:'pointer',fontSize:'0.8rem'}}>
                {p.l}
              </button>
            ))}
          </div>
        </Field>
        {plan!=='free'&&(
          <Field label={t('duration')}>
            <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:'0.5rem'}}>
              {[['30',t('one_month')],['90',t('three_months')],['365',t('one_year')]].map(([d,l])=>(
                <button key={d} onClick={()=>setDays(d)}
                  style={{padding:'0.5rem',borderRadius:'0.75rem',border:`2px solid ${days===d?B.accent:B.border}`,background:days===d?B.accentSoft:'transparent',color:days===d?B.accent:B.text,fontWeight:'700',cursor:'pointer',fontSize:'0.8rem'}}>
                  {l}
                </button>
              ))}
            </div>
          </Field>
        )}
        <label style={{display:'flex',alignItems:'center',gap:'0.75rem',padding:'0.875rem',background:active?`rgba(34,197,94,0.1)`:`rgba(239,68,68,0.1)`,borderRadius:'0.75rem',cursor:'pointer',border:`1px solid ${active?`rgba(34,197,94,0.2)`:`rgba(239,68,68,0.2)`}`}}>
          <input type="checkbox" checked={active} onChange={e=>setActive(e.target.checked)} style={{width:'1.25rem',height:'1.25rem',accentColor:B.success}}/>
          <div>
            <div style={{fontWeight:'700',color:active?B.success:B.danger,fontSize:'0.875rem'}}>{active?t('account_active'):t('account_suspended')}</div>
          </div>
        </label>
        <Field label={t('notes')}>
          <textarea value={notes} onChange={e=>setNotes(e.target.value)} placeholder={t('notes_ph')}
            style={{...INP,height:'70px',resize:'none'}}/>
        </Field>
        <button onClick={save} style={{width:'100%',padding:'0.9rem',borderRadius:'0.875rem',background:`linear-gradient(135deg,${B.accent},#cc2f0f)`,color:'white',fontWeight:'800',border:'none',cursor:'pointer',boxShadow:`0 4px 16px ${B.accent}44`}}>
          {t('save_changes')}
        </button>
      </div>
    </Modal>
  );
}

// ─── AGENCY APP ───────────────────────────────────────────
function AgencyApp({agency,onLogout}){
  const[data,setData]=useState(EMPTY);
  const[loading,setLoading]=useState(true);
  const[saving,setSaving]=useState(false);
  const[tab,setTab]=useState('dashboard');
  const[toast,setToast]=useState(null);
  const[isMobile,setIsMobile]=useState(window.innerWidth<640);
  useEffect(()=>{const fn=()=>setIsMobile(window.innerWidth<640);window.addEventListener('resize',fn);return()=>window.removeEventListener('resize',fn);},[]);

  useEffect(()=>{DB.loadData(agency.id).then(d=>{setData(d);setLoading(false);});},[agency.id]);

  const persist=async next=>{
    setData(next);setSaving(true);
    try{await DB.saveData(agency.id,next);}
    catch(e){showToast(t('toast_save_failed'),'error');}
    finally{setSaving(false);}
  };
  const showToast=(msg,type='success')=>{setToast({msg,type});setTimeout(()=>setToast(null),3000);};

  const canAdd=type=>{
    if(agency.plan!=='free')return true;
    if(type==='editor')return data.editors.length<FREE_LIMITS.editors;
    if(type==='client')return data.clients.length<FREE_LIMITS.clients;
    if(type==='video')return data.videos.length<FREE_LIMITS.videos;
    return true;
  };

  const solo=agency.account_type==='solo';
  const tabs=[
    {id:'dashboard',label:t('dashboard'),ic:'dashboard'},
    {id:'videos',label:t('videos'),ic:'film'},
    {id:'editors',label:t('team'),ic:'users'},
    {id:'clients',label:t('clients'),ic:'briefcase'},
  ].filter(tt=>!(solo&&tt.id==='editors'));

  const addEditor=(name,pw,role='editor')=>{
    if(!canAdd('editor'))return showToast(t('toast_limit',FREE_LIMITS.editors),'error');
    persist({...data,editors:[...data.editors,{id:uid(),name,password:hash(pw),role}]});showToast(t('toast_editor_added'));
  };
  const updEditor=(id,patch)=>persist({...data,editors:data.editors.map(e=>e.id===id?{...e,...patch}:e)});
  const delEditor=id=>{if(!confirm(t('confirm_delete')))return;persist({...data,editors:data.editors.filter(e=>e.id!==id),videos:data.videos.filter(v=>v.editorId!==id)});showToast(t('toast_deleted'));};
  const addClient=name=>{
    if(!canAdd('client'))return showToast(t('toast_limit',FREE_LIMITS.clients),'error');
    persist({...data,clients:[...data.clients,{id:uid(),name}]});showToast(t('toast_client_added'));
  };
  const updClient=(id,name)=>persist({...data,clients:data.clients.map(c=>c.id===id?{...c,name}:c)});
  const delClient=id=>{if(!confirm(t('confirm_delete')))return;persist({...data,clients:data.clients.filter(c=>c.id!==id),videos:data.videos.filter(v=>v.clientId!==id)});showToast(t('toast_deleted'));};
  const addVideo=v=>{
    if(!canAdd('video'))return showToast(t('toast_limit',FREE_LIMITS.videos),'error');
    persist({...data,videos:[{id:uid(),...v,paid:false,createdAt:new Date().toISOString()},...data.videos]});showToast(t('toast_video_added'));
  };
  const updVideo=(id,patch)=>persist({...data,videos:data.videos.map(x=>x.id===id?{...x,...patch}:x)});
  const delVideo=id=>{if(!confirm(t('confirm_delete')))return;persist({...data,videos:data.videos.filter(x=>x.id!==id)});showToast(t('toast_deleted'));};
  const togglePaid=id=>{const v=data.videos.find(x=>x.id===id);persist({...data,videos:data.videos.map(x=>x.id===id?{...x,paid:!v.paid}:x)});};

  const pl=planLabel(agency.plan);const dl=daysLeft(agency);

  if(loading)return(
    <div style={{minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center',background:B.bg,flexDirection:'column',gap:'1.25rem'}}>
      <div style={{position:'relative'}}>
        <Logo size={72}/>
        <div style={{position:'absolute',inset:-8,borderRadius:'32%',border:`2px solid ${B.accent}33`,animation:'spin 3s linear infinite'}}/>
      </div>
      <div style={{display:'flex',gap:'0.4rem'}}>
        {[0,1,2].map(i=><div key={i} style={{width:'6px',height:'6px',borderRadius:'50%',background:B.accent,opacity:0.6,animation:`pulse 1.2s ease ${i*0.2}s infinite`}}/>)}
      </div>
    </div>
  );

  return(
    <div style={{minHeight:'100vh',background:B.bg,fontFamily:"'Tajawal','Cairo',sans-serif"}}>
      <header style={{borderBottom:`1px solid ${B.border}`,background:B.navBg,backdropFilter:'blur(16px)',position:'sticky',top:0,zIndex:40}}>
        <div style={{maxWidth:'80rem',margin:'0 auto',padding:'0.7rem 1rem',display:'flex',alignItems:'center',justifyContent:'space-between',gap:'0.75rem'}}>
          <div style={{display:'flex',alignItems:'center',gap:'0.75rem'}}>
            <Logo size={36}/>
            <div>
              <div style={{fontWeight:'800',fontSize:'0.92rem',color:B.text,lineHeight:1.2}}>{agency.name}</div>
              <div style={{fontSize:'0.62rem',display:'flex',alignItems:'center',gap:'0.35rem',marginTop:'2px',flexWrap:'wrap'}}>
                <span style={{padding:'0.1rem 0.45rem',borderRadius:'9999px',background:pl.bg,color:pl.color,fontWeight:'700'}}>{pl.label}</span>
                {dl!==null&&<span style={{color:dl<7?B.danger:B.muted}}>· {t('days_left',dl)}</span>}
                {saving&&<span style={{color:B.accent}}>· ⟳</span>}
              </div>
            </div>
          </div>
          <div style={{display:'flex',alignItems:'center',gap:'0.5rem'}}>
            <SettingsBar/>
            {!isMobile&&<nav style={{display:'flex',gap:'0.15rem',background:B.inputBg,borderRadius:'9999px',padding:'0.2rem'}}>
              {tabs.map(tt=>(
                <button key={tt.id} onClick={()=>setTab(tt.id)}
                  style={{display:'flex',alignItems:'center',gap:'0.3rem',padding:'0.4rem 0.75rem',borderRadius:'9999px',border:'none',cursor:'pointer',fontWeight:'700',fontSize:'0.72rem',whiteSpace:'nowrap',background:tab===tt.id?B.accent:'transparent',color:tab===tt.id?'white':B.muted}}>
                  <Ic n={tt.ic} size={13}/>{tt.label}
                </button>
              ))}
            </nav>}
            <button onClick={onLogout} style={{padding:'0.45rem',borderRadius:'50%',border:`1px solid ${B.border}`,background:B.card,cursor:'pointer',color:B.muted,display:'flex'}}>
              <Ic n="logout" size={15}/>
            </button>
          </div>
        </div>
        {agency.plan==='free'&&(
          <div style={{background:B.accentSoft,borderTop:`1px solid ${B.accentBorder}`,padding:'0.35rem 1rem',textAlign:'center',fontSize:'0.7rem',color:B.accent,fontWeight:'700'}}>
            {t('free_warning',data.editors.length,FREE_LIMITS.editors,data.videos.length,FREE_LIMITS.videos)}
          </div>
        )}
        {dl!==null&&dl<=7&&dl>0&&(
          <div style={{background:B.dangerSoft,borderTop:`1px solid rgba(239,68,68,0.15)`,padding:'0.35rem 1rem',textAlign:'center',fontSize:'0.7rem',color:B.danger,fontWeight:'700'}}>
            {t('expiry_warning',dl)}
          </div>
        )}
      </header>

      <main style={{maxWidth:'80rem',margin:'0 auto',padding:'1.25rem 1rem',paddingBottom:isMobile?'6rem':'1.25rem'}}>
        {tab==='dashboard'&&<AgencyDash data={data} setTab={setTab} agency={agency} solo={solo}/>}
        {tab==='videos'&&<VideosTab data={data} addVideo={addVideo} updVideo={updVideo} delVideo={delVideo} togglePaid={togglePaid} solo={solo} selfName={agency.name}/>}
        {tab==='editors'&&<TeamTab data={data} addEditor={addEditor} updEditor={updEditor} delEditor={delEditor} canAdd={canAdd('editor')} limit={FREE_LIMITS.editors} plan={agency.plan}/>}
        {tab==='clients'&&<ClientsTab data={data} addClient={addClient} updClient={updClient} delClient={delClient} canAdd={canAdd('client')} limit={FREE_LIMITS.clients} plan={agency.plan}/>}
      </main>
      {isMobile&&<BottomNav tabs={tabs} tab={tab} setTab={setTab}/>}
      <Toast toast={toast}/>
    </div>
  );
}

// ─── AGENCY DASHBOARD ─────────────────────────────────────
function AgencyDash({data,setTab,agency,solo}){
  const stats=useMemo(()=>{
    const tot=data.videos.reduce((s,v)=>s+Number(v.price||0),0);
    const pd=data.videos.filter(v=>v.paid).reduce((s,v)=>s+Number(v.price||0),0);
    const ms=new Date();ms.setDate(1);ms.setHours(0,0,0,0);
    const mv=data.videos.filter(v=>new Date(v.date)>=ms);
    const be={};
    data.videos.forEach(v=>{
      if(!be[v.editorId])be[v.editorId]={total:0,owed:0,count:0};
      be[v.editorId].total+=Number(v.price||0);be[v.editorId].count++;
      if(!v.paid)be[v.editorId].owed+=Number(v.price||0);
    });
    return{tot,pd,owed:tot-pd,mTot:mv.reduce((s,v)=>s+Number(v.price||0),0),mCnt:mv.length,
      edRows:data.editors.map(e=>({...e,...(be[e.id]||{total:0,owed:0,count:0})})).sort((a,b)=>b.owed-a.owed)};
  },[data]);
  const eMap=Object.fromEntries(data.editors.map(e=>[e.id,e.name]));
  const cMap=Object.fromEntries(data.clients.map(c=>[c.id,c.name]));

  if(!data.editors.length&&!data.clients.length&&!data.videos.length)return(
    <div style={{textAlign:'center',padding:'3.5rem 1rem'}} className="fade-up">

          <Ic n="users" size={16} color="white"/>{t('team')}
        </button>}
        <button onClick={()=>setTab('clients')} style={{display:'flex',alignItems:'center',gap:'0.5rem',padding:'0.75rem 1.5rem',borderRadius:'9999px',background:solo?`linear-gradient(135deg,${B.accent},#cc2f0f)`:B.card,color:solo?'white':B.text,fontWeight:'700',border:solo?'none':`1px solid ${B.border}`,cursor:'pointer',boxShadow:solo?`0 6px 20px ${B.accent}44`:'none'}}>
          <Ic n="briefcase" size={16} color={solo?'white':undefined}/>{t('clients')}

      </div>

  );

  return(
    <div style={{display:'flex',flexDirection:'column',gap:'1.25rem'}}>
      {/* Monthly hero card */}

function VideoForm({editors,clients,initial,lockedEditor,onClose,onSave}){

            <Field label={t('clients')}><select value={f.clientId} onChange={e=>setF({...f,clientId:e.target.value})} style={INP}>{clients.map(c=><option key={c.id} value={c.id}>{c.name}</option>)}</select></Field>

              </button>
            ))}
          </div>
        </Field>
        <Field label={initial?t('pw_optional'):t('password')}>
          <PwField value={pw} onChange={setPw} show={show} setShow={setShow} placeholder={initial?t('pw_optional'):t('pw_hint')} onEnter={submit}/>
        </Field>
        {err&&<div style={{fontSize:'0.75rem',color:B.danger,fontWeight:'700'}}>{err}</div>}
        <button onClick={submit} style={{width:'100%',padding:'0.9rem',borderRadius:'0.875rem',background:`linear-gradient(135deg,${B.accent},#cc2f0f)`,color:'white',fontWeight:'800',border:'none',cursor:'pointer',boxShadow:`0 4px 16px ${B.accent}44`}}>{initial?t('save'):t('add')}</button>
      </div>
    </Modal>
  );
}

function TeamTab({data,addEditor,updEditor,delEditor,canAdd,limit,plan}){
  const[showForm,setShowForm]=useState(false);const[editing,setEditing]=useState(null);
  const stats=useMemo(()=>{const m={};data.videos.forEach(v=>{if(!m[v.editorId])m[v.editorId]={count:0,total:0,owed:0};m[v.editorId].count++;m[v.editorId].total+=Number(v.price||0);if(!v.paid)m[v.editorId].owed+=Number(v.price||0);});return m;},[data.videos]);
  return(
    <div style={{display:'flex',flexDirection:'column',gap:'1.25rem'}}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
        <div>
          <h2 style={{fontSize:'1.75rem',fontWeight:'900',color:B.text}}>{t('team')}</h2>
          {plan==='free'&&<div style={{fontSize:'0.75rem',color:B.muted}}>{data.editors.length}/{limit}</div>}
        </div>
        <button onClick={()=>{setEditing(null);setShowForm(true);}} style={{display:'flex',alignItems:'center',gap:'0.4rem',padding:'0.625rem 1rem',borderRadius:'9999px',background:canAdd?B.accent:'#333',color:'white',fontWeight:'700',border:'none',cursor:'pointer',fontSize:'0.8rem'}}>
          <Ic n="plus" size={16} color="white"/>{t('add')}
        </button>
      </div>
      <div style={{padding:'0.75rem 1rem',background:B.accentSoft,border:`1px solid ${B.accent}33`,borderRadius:'0.75rem',fontSize:'0.8rem',color:B.accent}}>
        {t('pw_info')}
      </div>
      <div style={{background:B.card,borderRadius:'1rem',border:`1px solid ${B.border}`,overflow:'hidden'}}>
        {data.editors.length===0?<div style={{padding:'2.5rem',textAlign:'center',color:B.muted,fontSize:'0.875rem'}}>{t('no_team')}</div>
        :data.editors.map(item=>{
          const s=stats[item.id]||{count:0,total:0,owed:0};
          const r=item.role||'editor';
          const rc=roleColor(r);
          return(
            <div key={item.id} style={{padding:'0.875rem 1rem',display:'flex',alignItems:'center',gap:'0.75rem',borderBottom:`1px solid ${B.border}`}}>
              <div style={{width:'2.75rem',height:'2.75rem',borderRadius:'50%',display:'grid',placeItems:'center',fontWeight:'800',flexShrink:0,background:`linear-gradient(135deg,${rc},${rc}88)`,color:'white',fontSize:'1.1rem',boxShadow:`0 3px 10px ${rc}44`}}>
                {item.name.charAt(0)}
              </div>
              <div style={{flex:1,minWidth:0}}>
                <div style={{display:'flex',alignItems:'center',gap:'0.4rem',marginBottom:'1px'}}>
                  <span style={{fontWeight:'700',color:B.text,fontSize:'0.9rem'}}>{item.name}</span>
                  <span style={{fontSize:'0.58rem',fontWeight:'700',padding:'0.1rem 0.4rem',borderRadius:'9999px',background:roleBg(r),color:rc,border:`1px solid ${rc}33`}}>{roleLabel(r)}</span>
                </div>
                <div style={{fontSize:'0.7rem',color:B.muted,display:'flex',gap:'0.5rem',alignItems:'center'}}>
                  <span>{s.count} {t('videos')}</span>
                  <span style={{color:B.border}}>·</span>
                  <span>{fmt(s.total)} دج</span>
                  {s.owed>0&&<><span style={{color:B.border}}>·</span><span style={{color:B.accent,fontWeight:'700'}}>{fmt(s.owed)} دج ⏳</span></>}
                </div>
              </div>
              <div style={{display:'flex',gap:'0.1rem',flexShrink:0}}>
                <button onClick={()=>{setEditing(item);setShowForm(true);}} style={{padding:'0.4rem 0.45rem',border:'none',background:'none',cursor:'pointer',color:B.muted,display:'flex',borderRadius:'0.5rem'}}><Ic n="pencil" size={14}/></button>
                <button onClick={()=>delEditor(item.id)} style={{padding:'0.4rem 0.45rem',border:'none',background:'none',cursor:'pointer',display:'flex',borderRadius:'0.5rem'}}><Ic n="trash" size={14} color={B.danger}/></button>
              </div>
            </div>
          );
        })}
      </div>
      {showForm&&<WorkerForm initial={editing} onClose={()=>{setShowForm(false);setEditing(null);}} onSave={(name,pw,role)=>{if(editing){const p={name,role};if(pw)p.password=hash(pw);updEditor(editing.id,p);}else addEditor(name,pw,role);setShowForm(false);setEditing(null);}}/>}
    </div>
  );
}

function ClientsTab({data,addClient,updClient,delClient,canAdd,limit,plan}){
  const[name,setName]=useState('');const[edId,setEdId]=useState(null);const[edName,setEdName]=useState('');
  const stats=useMemo(()=>{const m={};data.videos.forEach(v=>{if(!m[v.clientId])m[v.clientId]={count:0,total:0};m[v.clientId].count++;m[v.clientId].total+=Number(v.price||0);});return m;},[data.videos]);
  const doAdd=()=>{if(name.trim()){addClient(name);setName('');}};
  return(
    <div style={{display:'flex',flexDirection:'column',gap:'1.25rem'}}>
      <div>
        <h2 style={{fontSize:'1.75rem',fontWeight:'900',color:B.text}}>{t('clients')}</h2>
        {plan==='free'&&<div style={{fontSize:'0.75rem',color:B.muted}}>{data.clients.length}/{limit}</div>}
      </div>
      <div style={{background:B.card,borderRadius:'1.25rem',border:`1px solid ${B.border}`,padding:'0.75rem',display:'flex',gap:'0.5rem'}}>
        <input value={name} onChange={e=>setName(e.target.value)} onKeyDown={e=>e.key==='Enter'&&doAdd()} placeholder="اسم الزبون..." style={{...INP,flex:1}}/>
        <button onClick={doAdd} style={{display:'flex',alignItems:'center',gap:'0.4rem',padding:'0.75rem 1rem',borderRadius:'0.875rem',background:canAdd?`linear-gradient(135deg,${B.accent},#cc2f0f)`:'#333',color:'white',fontWeight:'700',border:'none',cursor:'pointer',flexShrink:0,boxShadow:canAdd?`0 4px 12px ${B.accent}44`:'none'}}>
          <Ic n="plus" size={16} color="white"/>{t('add')}
        </button>
      </div>
      <div style={{background:B.card,borderRadius:'1rem',border:`1px solid ${B.border}`,overflow:'hidden'}}>
        {data.clients.length===0?<div style={{padding:'2.5rem',textAlign:'center',color:B.muted,fontSize:'0.875rem'}}>{t('no_clients')}</div>
        :data.clients.map(item=>{
          const s=stats[item.id]||{count:0,total:0};const isEd=edId===item.id;
          return(
            <div key={item.id} style={{padding:'0.875rem 1.25rem',display:'flex',alignItems:'center',gap:'0.75rem',borderBottom:`1px solid ${B.border}`}}>
              <div style={{width:'2.5rem',height:'2.5rem',borderRadius:'50%',display:'grid',placeItems:'center',fontWeight:'700',flexShrink:0,background:'rgba(59,130,246,0.15)',color:'#60a5fa'}}>{item.name.charAt(0)}</div>
              <div style={{flex:1,minWidth:0}}>
                {isEd?<div style={{display:'flex',gap:'0.5rem'}}>
                  <input value={edName} onChange={e=>setEdName(e.target.value)} onKeyDown={e=>e.key==='Enter'&&(edName.trim()&&updClient(edId,edName.trim()),setEdId(null))}
                    style={{flex:1,padding:'0.375rem 0.75rem',border:`1px solid ${B.border}`,borderRadius:'0.5rem',outline:'none',fontSize:'0.875rem',background:B.inputBg,color:B.text}} autoFocus/>
                  <button onClick={()=>{if(edName.trim())updClient(edId,edName.trim());setEdId(null);}} style={{padding:'0.4rem',border:'none',background:'none',cursor:'pointer',color:B.success,display:'flex'}}><Ic n="check" size={16} color={B.success}/></button>
                  <button onClick={()=>setEdId(null)} style={{padding:'0.4rem',border:'none',background:'none',cursor:'pointer',color:B.muted,display:'flex'}}><Ic n="x" size={16}/></button>
                </div>:<><div style={{fontWeight:'700',color:B.text}}>{item.name}</div><div style={{fontSize:'0.75rem',color:B.muted}}>{s.count} {t('videos')} · {fmt(s.total)} دج</div></>}
              </div>
              {!isEd&&<div style={{display:'flex',gap:'0.15rem',flexShrink:0}}>
                <button onClick={()=>{setEdId(item.id);setEdName(item.name);}} style={{padding:'0.4rem',border:'none',background:'none',cursor:'pointer',color:B.muted,display:'flex'}}><Ic n="pencil" size={14}/></button>
                <button onClick={()=>delClient(item.id)} style={{padding:'0.4rem',border:'none',background:'none',cursor:'pointer',color:B.danger,display:'flex'}}><Ic n="trash" size={14} color={B.danger}/></button>
              </div>}
            </div>
          );
        })}
      </div>
    </div>
  );
}

// ─── ROOT ─────────────────────────────────────────────────
function App(){
  const[screen,setScreen]=useState('landing');
  const[agency,setAgency]=useState(null);
  const[worker,setWorker]=useState(null);
  const[workerData,setWorkerData]=useState(null);

  useEffect(()=>{
    const s=localStorage.getItem('_session');
    if(s){
      try{
        const p=JSON.parse(s);
        if(p.type==='superadmin')setScreen('superadmin');
        else if(p.type==='agency'&&p.agency){
          if(isSuspended(p.agency)||isExpired(p.agency)&&p.agency.plan!=='free'){setAgency(p.agency);setScreen('expired');}
          else{setAgency(p.agency);setScreen('agency');}
        }
        else if(p.type==='worker'&&p.agency&&p.worker){
          if(isSuspended(p.agency)||isExpired(p.agency)&&p.agency.plan!=='free'){setAgency(p.agency);setScreen('expired');}
          else{setAgency(p.agency);setWorker(p.worker);setWorkerData(p.workerData);setScreen('worker');}
        }
      }catch(e){}
    }
  },[]);

  const save=s=>localStorage.setItem('_session',JSON.stringify(s));

  const onAgency=ag=>{
    if(isSuspended(ag)||isExpired(ag)&&ag.plan!=='free'){setAgency(ag);setScreen('expired');return;}
    setAgency(ag);save({type:'agency',agency:ag});setScreen('agency');
  };
  const onWorker=(ag,w,d)=>{
    if(isSuspended(ag)||isExpired(ag)&&ag.plan!=='free'){setAgency(ag);setScreen('expired');return;}
    setAgency(ag);setWorker(w);setWorkerData(d);save({type:'worker',agency:ag,worker:w,workerData:d});setScreen('worker');
  };
  const onSuper=()=>{save({type:'superadmin'});setScreen('superadmin');};
  const logout=()=>{localStorage.removeItem('_session');setAgency(null);setWorker(null);setWorkerData(null);setScreen('landing');};

  const isConnErr=s=>s&&(s.includes('Failed to fetch')||s.includes('تعذّر الاتصال'));

  if(screen==='landing')return<Landing onLogin={()=>setScreen('login')} onRegister={()=>setScreen('register')}/>;
  if(screen==='register')return<Register onBack={()=>setScreen('landing')} onSuccess={onAgency}/>;
  if(screen==='login')return<Login onBack={()=>setScreen('landing')} onAgencyLogin={onAgency} onWorkerLogin={onWorker} onSuperAdmin={onSuper}/>;
  if(screen==='superadmin')return<SuperAdmin onLogout={logout}/>;
  if(screen==='expired'&&agency)return<ExpiredScreen agency={agency} onLogout={logout}/>;
  if(screen==='agency'&&agency)return<AgencyApp agency={agency} onLogout={logout}/>;
  if(screen==='worker'&&worker&&agency)return<WorkerApp agency={agency} worker={worker} initialData={workerData} onLogout={logout}/>;
  return null;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
